const eliminarEntidadCompleta=async(entidadId)=>{
  const ref=db.collection('coonecta_datos').doc(entidadId);
  const subcolecciones=['ejes','objetivos','indicadores','seguimientos','cargos','poa_actividades','planes_operativos','vrio','contraste','pestel','bmc','eric'];
  for(const col of subcolecciones){
    const snap=await ref.collection(col).get();
    let batch=db.batch();let count=0;
    for(const doc of snap.docs){
      batch.delete(doc.ref);count++;
      if(count%400===0){await batch.commit();batch=db.batch();}
    }
    if(count%400!==0)await batch.commit();
  }
  await ref.delete();
};

const App=()=>{
  const[user,setUser]=useState(null);
  const[userRol,setUserRol]=useState(null);
  const[userCargo,setUserCargo]=useState('');
  const[loading,setLoading]=useState(true);
  useEffect(()=>{
    const unsub=auth.onAuthStateChanged(async(u)=>{
      setUser(u);
      if(u){
        await migrarDatosACompartido(u.uid,'coosanroque');
        const doc=await db.collection('coonecta_usuarios').doc(u.uid).get();
        if(doc.exists){setUserRol(doc.data().rol||'admin');setUserCargo(doc.data().cargo||'');}
        else setUserRol('admin');
      }else{setUserRol(null);}
      setLoading(false);
    });
    return()=>unsub();
  },[]);
  if(loading)return <div className="loading">⏳ Cargando...</div>;
  if(!user)return <AuthScreen/>;
  return <MainApp user={user} userRol={userRol} userCargo={userCargo}/>;
};

const VistaEntidades=({user,entidades,entidadActiva,isAdmin})=>{const[modal,setModal]=useState(null);const[form,setForm]=useState({});const[itemEdit,setItemEdit]=useState(null);const[loading,setLoading]=useState(false);
  const[busquedaPOA,setBusquedaPOA]=useState('');const guardar=async(e)=>{e.preventDefault();setLoading(true);try{const scoreConfig={critico:{min:0,max:parseFloat(form.criticoMax||60),color:'#DC2626',label:'Crítico'},precaucion:{min:parseFloat(form.precaucionMin||61),max:parseFloat(form.precaucionMax||85),color:'#F59E0B',label:'Precaución'},optimo:{min:parseFloat(form.optimoMin||86),max:100,color:'#059669',label:'Óptimo'}};const data={nombre:form.nombre,periodo:form.periodo,scoreConfig};if(itemEdit){await db.collection('coonecta_datos').doc(itemEdit.id).update(data);}else{await db.collection('coonecta_datos').add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}setModal(null);setForm({});setItemEdit(null);}catch(error){alert('Error: '+error.message);}finally{setLoading(false);}};const eliminar=async(id)=>{if(!window.confirm('¿Eliminar entidad y TODOS sus datos (VRIO, PESTEL, Canvas, ERIC, Cargos, Ejes, Objetivos, Indicadores, etc.)? Esta acción no se puede deshacer.'))return;try{await eliminarEntidadCompleta(id);}catch(error){alert('Error: '+error.message);}};const editarEntidad=(ent)=>{setItemEdit(ent);setForm({nombre:ent.nombre,periodo:ent.periodo,criticoMax:ent.scoreConfig?.critico?.max||60,precaucionMin:ent.scoreConfig?.precaucion?.min||61,precaucionMax:ent.scoreConfig?.precaucion?.max||85,optimoMin:ent.scoreConfig?.optimo?.min||86});setModal('entidad');};
  const[recalcLoading,setRecalcLoading]=useState(null);
  const recalcularScores=async(ent)=>{
    if(!ent.scoreConfig){alert('Esta entidad no tiene configuración de score.');return;}
    if(!window.confirm('¿Recalcular scores de TODOS los registros de "'+ent.nombre+'" según su configuración actual?\n\nCrítico: 0-'+ent.scoreConfig.critico.max+'% | Precaución: '+ent.scoreConfig.precaucion.min+'-'+ent.scoreConfig.precaucion.max+'% | Óptimo: '+ent.scoreConfig.optimo.min+'%+'))return;
    setRecalcLoading(ent.id);
    try{
      const sc=ent.scoreConfig;
      const calcS=(avance,metaMes,tipo)=>{
        if(!metaMes||metaMes===0)return'sin_meta';
        const r=(avance/metaMes)*100;
        if(tipo==='descendente'){
          const inv=r===0?100:Math.min((metaMes/avance)*100,200);
          if(inv>=sc.optimo.min)return'optimo';
          if(inv>=sc.precaucion.min)return'precaucion';
          return'critico';
        }
        if(r>=sc.optimo.min)return'optimo';
        if(r>=sc.precaucion.min)return'precaucion';
        return'critico';
      };
      // Obtener todos los seguimientos de la entidad
      const segsSnap=await db.collection('coonecta_datos').doc(ent.id).collection('seguimientos').get();
      // Obtener todos los indicadores para saber el tipo
      const indsSnap=await db.collection('coonecta_datos').doc(ent.id).collection('indicadores').get();
      const indsMap={};
      indsSnap.forEach(d=>{indsMap[d.id]={...d.data(),id:d.id};});
      // Procesar en lotes de 500 (límite de Firestore batch)
      const docs=segsSnap.docs;
      let lote=db.batch();
      let count=0;
      let total=0;
      for(const doc of docs){
        const seg=doc.data();
        const ind=indsMap[seg.indicadorId];
        if(!seg.metaMes||!seg.avance)continue;
        const tipo=ind?.tipo||'ascendente';
        const nuevoScore=calcS(parseFloat(seg.avance),parseFloat(seg.metaMes),tipo);
        const av=parseFloat(seg.avance),me=parseFloat(seg.metaMes);
        const nuevoRendimiento=me>0?(tipo==='descendente'?(av===0?100:Math.min((me/av)*100,200)):(av/me)*100):0;
        lote.update(doc.ref,{score:nuevoScore,rendimiento:nuevoRendimiento});
        count++;total++;
        if(count===499){await lote.commit();lote=db.batch();count=0;}
      }
      if(count>0)await lote.commit();
      alert('✅ '+total+' registros recalculados correctamente con el score de '+ent.nombre);
    }catch(err){alert('Error: '+err.message);}
    finally{setRecalcLoading(null);}
  };return(<div><div className="page-header"><h1>Mis Periodos PE</h1>{isAdmin&&<button className="btn-primary" style={{width:'auto'}} onClick={()=>{setItemEdit(null);setForm({nombre:'',periodo:'',criticoMax:'60',precaucionMin:'61',precaucionMax:'85',optimoMin:'86'});setModal('entidad');}}>+ Nuevo Periodo PE</button>}</div><div className="grid">{entidades.length===0?(<div className="empty-state"><h3>🏢 No hay periodos</h3><p>Crea tu primer periodo PE</p></div>):(entidades.map(ent=>(<div key={ent.id} className="card" style={{borderLeft:entidadActiva?.id===ent.id?'4px solid #A5C139':'4px solid transparent'}}><h3>{ent.nombre}</h3><div className="badge" style={{background:'#A5C139',color:'white',marginBottom:'0.5rem'}}>{ent.periodo}</div>{ent.scoreConfig&&(<p style={{color:'#059669',fontSize:'0.75rem',marginTop:'0.5rem'}}>Score: 0-{ent.scoreConfig.critico.max}% 🔴 | {ent.scoreConfig.precaucion.min}-{ent.scoreConfig.precaucion.max}% 🟡 | {ent.scoreConfig.optimo.min}%+ 🟢</p>)}{isAdmin&&<div className="btn-group"><button className="btn-edit" onClick={()=>editarEntidad(ent)}>✏️ Editar</button><button className="btn-secondary" onClick={()=>eliminar(ent.id)}>🗑️ Eliminar</button></div>}
              {isAdmin&&<button onClick={()=>recalcularScores(ent)} disabled={recalcLoading===ent.id} style={{marginTop:'0.5rem',width:'100%',padding:'0.5rem',border:'2px solid #A5C139',borderRadius:'6px',background:'white',color:'#A5C139',fontWeight:600,cursor:'pointer',fontSize:'0.8rem'}}>
                {recalcLoading===ent.id?'⏳ Recalculando...':'🔄 Recalcular Scores'}
              </button>}</div>)))}</div>{modal==='entidad'&&(<div className="modal-overlay" onClick={()=>setModal(null)}><div className="modal" onClick={e=>e.stopPropagation()}><div className="modal-header"><h2>{itemEdit?'Editar':'Nuevo'} Periodo PE</h2><button className="btn-cerrar" onClick={()=>setModal(null)}>×</button></div><div className="modal-body"><form onSubmit={guardar}><div className="form-group"><label>Nombre *</label><input type="text" value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})} required/></div><div className="form-group"><label>Periodo *</label><input type="text" value={form.periodo} onChange={e=>setForm({...form,periodo:e.target.value})} required placeholder="2025-2027"/></div><p style={{fontSize:'0.8rem',color:'#6B7280',marginTop:'-0.5rem',marginBottom:'1rem'}}>La misión, visión y valores se definen en "Direccionamiento" una vez creado el periodo.</p><div className="card" style={{background:'#FEF3C7',marginBottom:'1rem'}}><h4 style={{color:'#92400E',marginBottom:'0.5rem'}}>⚙️ Configuración de Score (Global)</h4><div className="form-row"><div className="form-group"><label>🔴 Crítico: 0% hasta</label><input type="number" value={form.criticoMax} onChange={e=>setForm({...form,criticoMax:e.target.value})} required/></div><div className="form-group"><label>🟡 Precaución: desde</label><input type="number" value={form.precaucionMin} onChange={e=>setForm({...form,precaucionMin:e.target.value})} required/></div></div><div className="form-row"><div className="form-group"><label>🟡 Precaución: hasta</label><input type="number" value={form.precaucionMax} onChange={e=>setForm({...form,precaucionMax:e.target.value})} required/></div><div className="form-group"><label>🟢 Óptimo: desde</label><input type="number" value={form.optimoMin} onChange={e=>setForm({...form,optimoMin:e.target.value})} required/></div></div><small style={{color:'#92400E'}}>Este score se aplicará a TODOS los indicadores de este periodo</small></div><button type="submit" className="btn-primary" disabled={loading}>{loading?'⏳ Guardando...':'💾 Guardar'}</button></form></div></div></div>)}</div>);};
const VistaDashboard=({entidad,datos})=>{
  const[anioSel,setAnioSel]=useState('');
  const[mesSel,setMesSel]=useState('');
  const[modalInforme,setModalInforme]=useState(false);
  const[actividadesPOA,setActividadesPOA]=useState([]);
  const[planesPOA,setPlanesPOA]=useState([]);

  useEffect(()=>{
    if(!entidad)return;
    const u1=db.collection('coonecta_datos').doc(entidad.id).collection('poa_actividades').onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      setActividadesPOA(d);
    });
    const u2=db.collection('coonecta_datos').doc(entidad.id).collection('planes_operativos').onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      d.sort((a,b)=>(b.anio||0)-(a.anio||0));
      setPlanesPOA(d);
    });
    return()=>{u1();u2();};
  },[entidad]);

  if(!entidad||!datos)return <div className="empty-state"><h3>Selecciona un periodo PE</h3></div>;
  const{ejes=[],objetivos=[],indicadores=[],seguimientos=[]}=datos;

  const mesesOrden=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre','Semestral 1','Semestral 2','Anual'];
  const aniosDisp=[...new Set(seguimientos.map(s=>String(s.anio)))].sort();
  const mesesDisp=[...new Set(seguimientos.filter(s=>!anioSel||String(s.anio)===anioSel).map(s=>s.mes))].sort((a,b)=>mesesOrden.indexOf(a)-mesesOrden.indexOf(b));
  const modoAnio=anioSel&&!mesSel; // "Ver todo el año" cuando hay año seleccionado pero no mes

  // Calcular período de referencia
  const periodos=[...new Set(seguimientos.map(s=>s.mes+'|'+s.anio))].sort((a,b)=>{
    const[mA,aA]=a.split('|');const[mB,aB]=b.split('|');
    if(aA!==aB)return parseInt(aA)-parseInt(aB);
    return mesesOrden.indexOf(mA)-mesesOrden.indexOf(mB);
  });
  const ultimoPeriodo=periodos[periodos.length-1];
  const[ultMes,ultAnio]=ultimoPeriodo?ultimoPeriodo.split('|'):['',''];

  const filtroMes=mesSel||(!modoAnio?ultMes:'');
  const filtroAnio=anioSel||ultAnio;
  const segsFiltrados=modoAnio
    ? seguimientos.filter(s=>String(s.anio)===String(filtroAnio))
    : seguimientos.filter(s=>String(s.anio)===String(filtroAnio)&&s.mes===filtroMes);
  const periodoLabel=modoAnio?`Todo el año ${filtroAnio}`:filtroMes&&filtroAnio?(filtroMes+' '+filtroAnio):'Sin datos';

  const porScore={critico:0,precaucion:0,optimo:0,sin_meta:0};
  if(modoAnio){
    indicadores.forEach(ind=>{
      const segsInd=segsFiltrados.filter(s=>s.indicadorId===ind.id);
      if(segsInd.length===0)return;
      const scores=['optimo','precaucion','critico','sin_meta'];
      const mejor=scores.find(sc=>segsInd.some(s=>s.score===sc))||'sin_meta';
      if(porScore[mejor]!==undefined)porScore[mejor]++;
    });
  }else{
    segsFiltrados.forEach(s=>{if(s.score&&porScore[s.score]!==undefined)porScore[s.score]++;});
  }

  const getMetaAnio=(ind,anio)=>{
    if(ind.metasPorAnio&&anio&&ind.metasPorAnio[String(anio)]!==undefined)
      return parseFloat(ind.metasPorAnio[String(anio)]);
    return parseFloat(ind.meta||0);
  };
  const indicadoresConEstado=indicadores.map(ind=>{
    const segsInd=segsFiltrados.filter(s=>s.indicadorId===ind.id);
    const segPeriodo=modoAnio?segsInd[segsInd.length-1]:segsInd[0];
    const segReciente=seguimientos.filter(s=>s.indicadorId===ind.id).sort((a,b)=>{
      if(a.anio!==b.anio)return parseInt(b.anio)-parseInt(a.anio);
      return mesesOrden.indexOf(b.mes)-mesesOrden.indexOf(a.mes);
    })[0];
    const ultSeg=segPeriodo||segReciente;
    let avanceCalc=0;
    let metaCalc=0;
    if(modoAnio){
      segsInd.forEach(s=>{
        if(s.avance)avanceCalc+=parseFloat(s.avance);
        if(s.metaMes)metaCalc+=parseFloat(s.metaMes);
      });
      if(ind.tipoMeta!=='acumulativa'&&segsInd.length>0){
        const ult=segsInd[segsInd.length-1];
        avanceCalc=parseFloat(ult.avance||0);
        metaCalc=parseFloat(ult.metaMes||getMetaAnio(ind,filtroAnio)||0);
      }
    }else{
      avanceCalc=ultSeg?.avance||0;
      metaCalc=ultSeg?.metaMes||getMetaAnio(ind,filtroAnio)||0;
      if(ind.tipoMeta==='acumulativa'){
        avanceCalc=0;metaCalc=0;
        const todosSegs=seguimientos.filter(s=>s.indicadorId===ind.id&&String(s.anio)===String(filtroAnio));
        const indicesMes=mesesOrden.indexOf(filtroMes);
        todosSegs.forEach(s=>{
          if(mesesOrden.indexOf(s.mes)<=indicesMes){
            if(s.avance)avanceCalc+=parseFloat(s.avance);
            if(s.metaMes)metaCalc+=parseFloat(s.metaMes);
          }
        });
      }
    }
    const obj=objetivos.find(o=>o.id===ind.objetivoId);
    const eje=ejes.find(e=>e.id===obj?.ejeId);
    const enPeriodo=modoAnio?segsInd.length>0:!!segPeriodo;
    const segsAnioOrdenados=modoAnio?[...segsInd].sort((a,b)=>{
      if(a.anio!==b.anio)return parseInt(a.anio)-parseInt(b.anio);
      return mesesOrden.indexOf(a.mes)-mesesOrden.indexOf(b.mes);
    }):[];
    return{...ind,ultimoSeguimiento:ultSeg,avanceAcum:avanceCalc,metaAcum:metaCalc,enPeriodo,objetivo:obj,eje:eje,segsAnio:segsAnioOrdenados};
  }).filter(ind=>ind.enPeriodo||(ind.ultimoSeguimiento&&!modoAnio));

  return(<div>
    <div className="page-header">
      <div>
        <h1>Dashboard - {entidad.nombre}</h1>
        <p style={{color:'#6B7280',fontSize:'0.875rem'}}>{entidad.periodo}</p>
      </div>
      <button className="btn-primary" style={{width:'auto'}} onClick={()=>window.print()}>🖨️ Imprimir Dashboard</button>
    </div>

    <div className="card" style={{marginBottom:'1rem'}}>
      <div style={{display:'flex',gap:'1rem',alignItems:'flex-end',flexWrap:'wrap'}}>
        <div className="form-group" style={{margin:0,minWidth:'140px'}}>
          <label style={{fontSize:'0.85rem',fontWeight:600}}>Año</label>
          <select value={anioSel} onChange={e=>{setAnioSel(e.target.value);setMesSel('');}}
            style={{padding:'0.4rem 0.5rem',border:'2px solid #E5E7EB',borderRadius:'8px',fontSize:'0.9rem',width:'100%'}}>
            <option value="">Último disponible</option>
            {aniosDisp.map(a=><option key={a} value={a}>{a}</option>)}
          </select>
        </div>
        <div className="form-group" style={{margin:0,minWidth:'160px'}}>
          <label style={{fontSize:'0.85rem',fontWeight:600}}>Mes / Período</label>
          <select value={mesSel} onChange={e=>setMesSel(e.target.value)}
            style={{padding:'0.4rem 0.5rem',border:'2px solid #E5E7EB',borderRadius:'8px',fontSize:'0.9rem',width:'100%'}}
            disabled={!anioSel&&!mesSel}>
            <option value="">{anioSel?'📅 Todo el año':'Último disponible'}</option>
            {mesesDisp.map(m=><option key={m} value={m}>{m}</option>)}
          </select>
        </div>
        <div style={{paddingBottom:'0.25rem'}}>
          <span style={{background:modoAnio?'#D1FAE5':'#FFF0F0',color:modoAnio?'#065F46':'#A5C139',padding:'0.4rem 0.75rem',borderRadius:'8px',fontWeight:700,fontSize:'0.875rem'}}>
            📅 {periodoLabel}
          </span>
        </div>
        {(anioSel||mesSel)&&<button onClick={()=>{setAnioSel('');setMesSel('');}} style={{padding:'0.4rem 0.75rem',border:'1px solid #E5E7EB',borderRadius:'8px',background:'white',cursor:'pointer',fontSize:'0.85rem'}}>✕ Limpiar</button>}
      </div>
    </div>

    {(()=>{
      const sc=entidad.scoreConfig||{critico:{min:0,max:60},precaucion:{min:61,max:85},optimo:{min:86,max:100}};
      const clasificar=(pct)=>{
        if(pct>=sc.optimo.min)return{label:'Óptimo',icon:'🟢',bg:'#D1FAE5',c:'#065F46',borde:'#059669'};
        if(pct>=sc.precaucion.min)return{label:'Precaución',icon:'🟡',bg:'#FEF3C7',c:'#92400E',borde:'#F59E0B'};
        return{label:'Crítico',icon:'🔴',bg:'#FEE2E2',c:'#991B1B',borde:'#DC2626'};
      };

      // ── Semáforo Indicadores ──
      const indConSeg=indicadoresConEstado.filter(i=>i.ultimoSeguimiento);
      const totalInd=indConSeg.length;
      const optimosInd=indConSeg.filter(i=>i.ultimoSeguimiento?.score==='optimo').length;
      const precaucionInd=indConSeg.filter(i=>i.ultimoSeguimiento?.score==='precaucion').length;
      const criticosInd=indConSeg.filter(i=>i.ultimoSeguimiento?.score==='critico').length;
      // Por conteo: % de indicadores en óptimo
      const pctIndConteo=totalInd>0?Math.round((optimosInd/totalInd)*100):0;
      const clIndConteo=totalInd>0?clasificar(pctIndConteo):{label:'Sin datos',icon:'⚪',bg:'#F3F4F6',c:'#6B7280',borde:'#E5E7EB'};
      // Por rendimiento: promedio de rendimientos individuales (cap 100% para no inflar)
      // Rendimiento: filtrar infinitos y NaN, cap 100%, ignorar sin meta
      const indsConRend=indConSeg.filter(i=>{const r=parseFloat(i.ultimoSeguimiento?.rendimiento||0);return isFinite(r)&&!isNaN(r)&&(i.ultimoSeguimiento?.metaMes||0)>0;});
      const pctIndRend=indsConRend.length>0?Math.round(indsConRend.reduce((acc,i)=>acc+Math.min(Math.max(parseFloat(i.ultimoSeguimiento?.rendimiento||0),0),100),0)/indsConRend.length):0;
      const clIndRend=totalInd>0?clasificar(pctIndRend):{label:'Sin datos',icon:'⚪',bg:'#F3F4F6',c:'#6B7280',borde:'#E5E7EB'};

      // ── Semáforo POA ──
      const anioActual=filtroAnio||new Date().getFullYear().toString();
      const planActivo=planesPOA.find(p=>String(p.anio)===String(anioActual))||planesPOA[0];
      const actsDelPlan=planActivo?actividadesPOA.filter(a=>a.planId===planActivo.id):[];
      const pctPOA=calcAvancePOA(actsDelPlan);
      const clPOA=actsDelPlan.length>0?clasificar(pctPOA):{label:'Sin datos',icon:'⚪',bg:'#F3F4F6',c:'#6B7280',borde:'#E5E7EB'};
      const completadasPOA=actsDelPlan.filter(a=>a.estado==='Completado').length;
      const enProcesoPOA=actsDelPlan.filter(a=>a.estado==='En Proceso').length;
      const canceladasPOA=actsDelPlan.filter(a=>a.estado==='Cancelada').length;
      const programadasPOA=actsDelPlan.filter(a=>a.estado==='Programada').length;

      return(<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem',marginBottom:'1.5rem'}}>
        {/* Semáforo Indicadores */}
        <div style={{background:'white',borderRadius:'12px',padding:'1.25rem',border:'2px solid #E5E7EB'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'1rem'}}>
            <div>
              <p style={{margin:0,fontSize:'0.75rem',fontWeight:700,color:'#374151',textTransform:'uppercase',letterSpacing:'0.05em'}}>Consolidado Indicadores</p>
              <p style={{margin:'0.15rem 0 0 0',fontSize:'0.8rem',color:'#6B7280'}}>{periodoLabel} · {totalInd} con seguimiento</p>
            </div>
          </div>
          {totalInd>0?(<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'0.75rem'}}>
            {/* Por conteo */}
            <div style={{background:clIndConteo.bg,borderRadius:'8px',padding:'0.75rem',border:`1px solid ${clIndConteo.borde}`}}>
              <p style={{margin:'0 0 0.25rem 0',fontSize:'0.7rem',fontWeight:700,color:clIndConteo.c,textTransform:'uppercase'}}>Por conteo</p>
              <div style={{display:'flex',alignItems:'baseline',gap:'0.3rem',marginBottom:'0.3rem'}}>
                <span style={{fontSize:'1.8rem',fontWeight:800,color:clIndConteo.c,lineHeight:1}}>{pctIndConteo}%</span>
                <span style={{fontSize:'0.75rem',fontWeight:700,color:clIndConteo.c}}>{clIndConteo.icon} {clIndConteo.label}</span>
              </div>
              <div style={{width:'100%',height:'5px',background:'rgba(0,0,0,0.1)',borderRadius:'3px',marginBottom:'0.4rem'}}>
                <div style={{width:Math.min(pctIndConteo,100)+'%',height:'100%',background:clIndConteo.c,borderRadius:'3px'}}></div>
              </div>
              <p style={{margin:0,fontSize:'0.7rem',color:clIndConteo.c}}>🟢 {optimosInd} · 🟡 {precaucionInd} · 🔴 {criticosInd}</p>
            </div>
            {/* Por rendimiento */}
            <div style={{background:clIndRend.bg,borderRadius:'8px',padding:'0.75rem',border:`1px solid ${clIndRend.borde}`}}>
              <p style={{margin:'0 0 0.25rem 0',fontSize:'0.7rem',fontWeight:700,color:clIndRend.c,textTransform:'uppercase'}}>Por rendimiento</p>
              <div style={{display:'flex',alignItems:'baseline',gap:'0.3rem',marginBottom:'0.3rem'}}>
                <span style={{fontSize:'1.8rem',fontWeight:800,color:clIndRend.c,lineHeight:1}}>{pctIndRend}%</span>
                <span style={{fontSize:'0.75rem',fontWeight:700,color:clIndRend.c}}>{clIndRend.icon} {clIndRend.label}</span>
              </div>
              <div style={{width:'100%',height:'5px',background:'rgba(0,0,0,0.1)',borderRadius:'3px',marginBottom:'0.4rem'}}>
                <div style={{width:Math.min(pctIndRend,100)+'%',height:'100%',background:clIndRend.c,borderRadius:'3px'}}></div>
              </div>
              <p style={{margin:0,fontSize:'0.7rem',color:clIndRend.c}}>Promedio de rendimiento individual</p>
            </div>
          </div>):<p style={{margin:0,fontSize:'0.85rem',color:'#6B7280',textAlign:'center',padding:'1rem 0'}}>Sin registros en este período</p>}
        </div>

        {/* Semáforo POA */}
        <div style={{background:clPOA.bg,borderRadius:'12px',padding:'1.25rem',border:`2px solid ${clPOA.borde}`}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'0.75rem'}}>
            <div>
              <p style={{margin:0,fontSize:'0.75rem',fontWeight:700,color:clPOA.c,textTransform:'uppercase',letterSpacing:'0.05em'}}>Consolidado POA</p>
              <p style={{margin:'0.15rem 0 0 0',fontSize:'0.8rem',color:clPOA.c,opacity:0.8}}>{planActivo?planActivo.nombre+' '+planActivo.anio:'Sin plan activo'}</p>
            </div>
            <span style={{fontSize:'2.5rem',lineHeight:1}}>{clPOA.icon}</span>
          </div>
          <div style={{display:'flex',alignItems:'baseline',gap:'0.5rem',marginBottom:'0.5rem'}}>
            <span style={{fontSize:'3rem',fontWeight:800,color:clPOA.c,lineHeight:1}}>{pctPOA}%</span>
            <span style={{fontSize:'0.9rem',fontWeight:700,color:clPOA.c}}>{clPOA.label}</span>
          </div>
          <div style={{width:'100%',height:'6px',background:'rgba(0,0,0,0.1)',borderRadius:'3px',marginBottom:'0.75rem'}}>
            <div style={{width:pctPOA+'%',height:'100%',background:clPOA.c,borderRadius:'3px'}}></div>
          </div>
          {actsDelPlan.length>0?<div style={{display:'flex',gap:'0.75rem',fontSize:'0.78rem',color:clPOA.c,flexWrap:'wrap'}}>
            <span>✅ {completadasPOA} completadas</span>
            <span>🔄 {enProcesoPOA} en proceso</span>
            <span>📋 {programadasPOA} programadas</span>
            {canceladasPOA>0&&<span>❌ {canceladasPOA} canceladas</span>}
          </div>:<p style={{margin:0,fontSize:'0.8rem',color:clPOA.c}}>Sin actividades en el plan</p>}
        </div>
      </div>);
    })()}

    <div className="grid">
      <div className="stat-card"><div className="stat-label">Ejes</div><div className="stat-value">{ejes.length}</div></div>
      <div className="stat-card"><div className="stat-label">Indicadores con seguimiento</div><div className="stat-value">{indicadoresConEstado.length}</div></div>
      <div className="stat-card" style={{borderLeftColor:'#059669'}}><div className="stat-label">🟢 Óptimos</div><div className="stat-value">{indicadoresConEstado.filter(i=>i.ultimoSeguimiento?.score==='optimo').length}</div></div>
      <div className="stat-card" style={{borderLeftColor:'#F59E0B'}}><div className="stat-label">🟡 Precaución</div><div className="stat-value">{indicadoresConEstado.filter(i=>i.ultimoSeguimiento?.score==='precaucion').length}</div></div>
      <div className="stat-card" style={{borderLeftColor:'#DC2626'}}><div className="stat-label">🔴 Críticos</div><div className="stat-value">{indicadoresConEstado.filter(i=>i.ultimoSeguimiento?.score==='critico').length}</div></div>
    </div>

    {indicadores.length>0&&<div className="card">
      <h3>📊 Estado de Indicadores — {periodoLabel}</h3>
      <table className="tabla">
        <thead><tr><th>Eje</th><th>Objetivo</th><th>Indicador</th><th>Meta</th><th>Avance</th><th>Rendimiento</th><th>Estado</th></tr></thead>
        <tbody>{indicadoresConEstado.map(ind=>{
          const s=ind.ultimoSeguimiento;
          const sc={optimo:{bg:'#D1FAE5',c:'#065F46',icon:'🟢'},precaucion:{bg:'#FEF3C7',c:'#92400E',icon:'🟡'},critico:{bg:'#FEE2E2',c:'#991B1B',icon:'🔴'},sin_meta:{bg:'#F3F4F6',c:'#6B7280',icon:'⚪'}}[s?.score||'sin_meta']||{bg:'#F3F4F6',c:'#6B7280',icon:'—'};
          if(modoAnio&&ind.segsAnio&&ind.segsAnio.length>1){
            // Modo año: expandir una fila por mes
            return(<React.Fragment key={ind.id}>
              <tr style={{background:'#F0F4FF'}}>
                <td rowSpan={ind.segsAnio.length+1}><div className="badge" style={{background:ind.eje?.color||'#6B7280',color:'white',padding:'0.2rem 0.5rem',borderRadius:'6px',fontSize:'0.75rem'}}>{ind.eje?.nombre||'-'}</div></td>
                <td rowSpan={ind.segsAnio.length+1} style={{fontSize:'0.8rem',color:'#6B7280'}}>{ind.objetivo?.nombre}</td>
                <td colSpan={5}><strong>{ind.nombre}</strong> <span style={{fontSize:'0.75rem',color:'#6B7280'}}>({ind.segsAnio.length} registros en {filtroAnio})</span></td>
              </tr>
              {ind.segsAnio.map(seg=>{
                const scc={optimo:{bg:'#D1FAE5',c:'#065F46',icon:'🟢'},precaucion:{bg:'#FEF3C7',c:'#92400E',icon:'🟡'},critico:{bg:'#FEE2E2',c:'#991B1B',icon:'🔴'},sin_meta:{bg:'#F3F4F6',c:'#6B7280',icon:'⚪'}}[seg.score||'sin_meta']||{bg:'#F3F4F6',c:'#6B7280',icon:'—'};
                return(<tr key={seg.id}>
                  <td style={{fontSize:'0.8rem',color:'#A5C139',fontWeight:600}}>{seg.mes}</td>
                  <td style={{fontSize:'0.8rem'}}>{(seg.metaMes||getMetaAnio(ind,seg.anio)||0)+' '+(ind.unidad||'')}</td>
                  <td style={{fontSize:'0.8rem'}}><strong>{parseFloat(seg.avance||0).toFixed(2)}</strong> {ind.unidad||''}</td>
                  <td style={{fontSize:'0.8rem'}}><strong>{(seg.rendimiento||0).toFixed(1)}%</strong></td>
                  <td><span style={{padding:'0.2rem 0.5rem',borderRadius:'6px',fontSize:'0.75rem',fontWeight:700,background:scc.bg,color:scc.c}}>{scc.icon} {seg.score==='optimo'?'Óptimo':seg.score==='precaucion'?'Precaución':seg.score==='critico'?'Crítico':'Sin meta'}</span></td>
                </tr>);
              })}
            </React.Fragment>);
          }
          return(<tr key={ind.id} style={{opacity:ind.enPeriodo||!s?1:0.7}}>
            <td><div className="badge" style={{background:ind.eje?.color||'#6B7280',color:'white',padding:'0.2rem 0.5rem',borderRadius:'6px',fontSize:'0.75rem'}}>{ind.eje?.nombre||'-'}</div></td>
            <td style={{fontSize:'0.8rem',color:'#6B7280',maxWidth:'120px'}}>{ind.objetivo?.nombre}</td>
            <td><strong>{ind.nombre}</strong>{!ind.enPeriodo&&s&&<span style={{fontSize:'0.7rem',color:'#9CA3AF',marginLeft:'0.3rem'}}>(último: {s.mes} {s.anio})</span>}</td>
            <td>{s?(ind.metaAcum||getMetaAnio(ind,filtroAnio)||s.metaAnual)+' '+(ind.unidad||''):'-'}</td>
            <td>{s?<div><div><strong>{ind.avanceAcum.toFixed(2)}</strong> {ind.unidad||''}</div>{ind.tipoMeta==='acumulativa'&&<div style={{fontSize:'0.7rem',color:'#6B7280'}}>📈 Acumulado</div>}</div>:'-'}</td>
            <td>{s?<strong>{((ind.avanceAcum||0)/(ind.metaAcum||1)*100).toFixed(1)}%</strong>:'-'}</td>
            <td>{s?<span style={{padding:'0.2rem 0.5rem',borderRadius:'6px',fontSize:'0.8rem',fontWeight:700,background:sc.bg,color:sc.c}}>{sc.icon} {s.score==='optimo'?'Óptimo':s.score==='precaucion'?'Precaución':s.score==='critico'?'Crítico':'Sin meta'}</span>:'-'}</td>
          </tr>);
        })}</tbody>
      </table>
    </div>}

    {modalInforme&&<ModalImpresionDashboard entidad={entidad} datos={datos} periodo={periodoLabel} onClose={()=>setModalInforme(false)}/>}
  </div>);
};
const CargosSelect=({value,onChange,entidad})=>{

    const unsub=db.collection('coonecta_cargos').onSnapshot(s=>{

const VistaCargos=({entidad})=>{
  const[cargos,setCargos]=useState([]);
  const[modal,setModal]=useState(false);
  useEffect(()=>{
    const migrar=async()=>{
      try{
        const snap=await db.collection('coonecta_cargos').get();
        if(!snap.empty)return;
        const periodos=await db.collection('coonecta_datos').get();
        const vistos=new Set();
        for(const periodo of periodos.docs){
          const cs=await periodo.ref.collection('cargos').get();
          for(const doc of cs.docs){
            const d=doc.data();
            if(d.nombre&&!vistos.has(d.nombre)){
              vistos.add(d.nombre);
              const {createdAt,...rest}=d;
              await db.collection('coonecta_cargos').add({...rest,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
            }
          }
        }
        if(vistos.size>0)console.log('Cargos migrados:',vistos.size);
      }catch(e){console.warn('Migracion cargos:',e);}
    };
    migrar();
  },[]);
  const[form,setForm]=useState({nombre:'',descripcion:'',area:''});
  const[itemEdit,setItemEdit]=useState(null);
  const[loading,setLoading]=useState(false);
  const[msg,setMsg]=useState('');
  useEffect(()=>{
    const unsub=db.collection('coonecta_cargos').onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      d.sort((a,b)=>a.nombre.localeCompare(b.nombre));setCargos(d);
    });
    return()=>unsub();
  },[entidad?.id]);
  const areasExistentes=[...new Set(cargos.map(c=>c.area).filter(Boolean))].sort();
  const guardar=async(e)=>{
    e.preventDefault();setLoading(true);
    try{
      const ref=db.collection('coonecta_cargos');
      if(itemEdit){await ref.doc(itemEdit.id).update({nombre:form.nombre,descripcion:form.descripcion||'',area:form.area||''});}
      else{await ref.add({nombre:form.nombre,descripcion:form.descripcion||'',area:form.area||'',createdAt:firebase.firestore.FieldValue.serverTimestamp()});}
      setModal(false);setForm({nombre:'',descripcion:'',area:''});setItemEdit(null);setMsg('Guardado.');
      setTimeout(()=>setMsg(''),3000);
    }catch(err){setMsg('Error: '+err.message);}
    finally{setLoading(false);}
  };
  const eliminar=async(id)=>{if(!window.confirm('¿Eliminar cargo?'))return;await db.collection('coonecta_cargos').doc(id).delete();};
  const editar=(c)=>{setItemEdit(c);setForm({nombre:c.nombre,descripcion:c.descripcion||'',area:c.area||''});setModal(true);};
  return(<div>
    <div className="page-header"><h1>🏷️ Cargos</h1>
      <button className="btn-primary" style={{width:'auto'}} onClick={()=>{setItemEdit(null);setForm({nombre:'',descripcion:'',area:''});setModal(true);}}>+ Nuevo Cargo</button>
    </div>
    {msg&&<div style={{padding:'0.75rem',borderRadius:'8px',background:'#D1FAE5',color:'#065F46',marginBottom:'1rem'}}>{msg}</div>}
    <div className="card">
      <p style={{color:'#6B7280',marginBottom:'1rem'}}>Los cargos son compartidos por todos los periodos PE — es la misma gente. El campo Área agrupa varios cargos (ej. "Líder de Riesgos" y "Analista de Riesgos" → área "Riesgos") para que compartan la misma información en Análisis y Diagnóstico.</p>
      {cargos.length===0?<p style={{color:'#6B7280'}}>No hay cargos creados aún.</p>:
      <div className="grid">{cargos.map(c=><div key={c.id} className="card" style={{borderLeft:'4px solid #A5C139',margin:0}}>
        <h4>{c.nombre}</h4>
        {c.area?<span style={{fontSize:'0.75rem',color:'#A5C139',fontWeight:600}}>🗂️ Área: {c.area}</span>:<span style={{fontSize:'0.75rem',color:'#DC2626'}}>⚠️ Sin área asignada</span>}
        {c.descripcion&&<p style={{color:'#6B7280',fontSize:'0.875rem',marginTop:'0.25rem'}}>{c.descripcion}</p>}
        <div className="btn-group">
          <button className="btn-edit" onClick={()=>editar(c)}>✏️ Editar</button>
          <button className="btn-secondary" onClick={()=>eliminar(c.id)}>🗑️ Eliminar</button>
        </div>
      </div>)}</div>}
    </div>
    {modal&&<div className="modal-overlay" onClick={()=>{setModal(false);setItemEdit(null);}}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-header"><h2>{itemEdit?'Editar':'Nuevo'} Cargo</h2>
          <button className="btn-cerrar" onClick={()=>{setModal(false);setItemEdit(null);}}>x</button>
        </div>
        <div className="modal-body"><form onSubmit={guardar}>
          <div className="form-group"><label>Nombre *</label>
            <input type="text" value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})} required placeholder="Ej. Líder de Riesgos"/>
          </div>
          <div className="form-group"><label>Área *</label>
            <input type="text" list="areas-existentes" value={form.area} onChange={e=>setForm({...form,area:e.target.value})} required placeholder="Ej. Riesgos"/>
            <datalist id="areas-existentes">{areasExistentes.map(a=><option key={a} value={a}/>)}</datalist>
            <small style={{color:'#6B7280',display:'block',marginTop:'0.25rem'}}>Varios cargos pueden compartir la misma área (ej. Coordinador y Auxiliar de Talento Humano → "Talento Humano").</small>

          <div className="form-group"><label>Descripción</label>
            <textarea value={form.descripcion} onChange={e=>setForm({...form,descripcion:e.target.value})} rows={2}/>

        </form></div>
      </div>
    </div>}

};

const VistaDireccionamiento=({entidad,isAdmin})=>{
  const[mision,setMision]=useState('');
  const[vision,setVision]=useState('');
  const[valores,setValores]=useState([]);
  const[nuevoValor,setNuevoValor]=useState('');
  const[nuevoDesc,setNuevoDesc]=useState('');
  const[principios,setPrincipios]=useState([]);
  const[nuevoPrincipio,setNuevoPrincipio]=useState('');
  const[nuevoPrincipioDesc,setNuevoPrincipioDesc]=useState('');
  const[loading,setLoading]=useState(false);
  useEffect(()=>{
    if(!entidad)return;
    setMision(entidad.mision||'');
    setVision(entidad.vision||'');
    setValores(entidad.valores||[]);
    setPrincipios(entidad.principios||[]);
  },[entidad]);
  if(!entidad)return <div className="empty-state"><h3>Selecciona un periodo PE</h3></div>;
  const guardar=async(campo,valor)=>{
    setLoading(true);
    try{await db.collection('coonecta_datos').doc(entidad.id).update({[campo]:valor});}
    catch(error){alert('Error: '+error.message);}
    finally{setLoading(false);}
  };
  const agregarValor=async(e)=>{
    e.preventDefault();
    if(!nuevoValor.trim())return;
    const next=[...valores,{nombre:nuevoValor,descripcion:nuevoDesc}];
    setValores(next);
    await guardar('valores',next);
    setNuevoValor('');setNuevoDesc('');
  };
  const quitarValor=async(idx)=>{
    const next=valores.filter((_,i)=>i!==idx);
    setValores(next);
    await guardar('valores',next);
  };
  const agregarPrincipio=async(e)=>{
    e.preventDefault();
    if(!nuevoPrincipio.trim())return;
    const next=[...principios,{nombre:nuevoPrincipio,descripcion:nuevoPrincipioDesc}];
    setPrincipios(next);
    await guardar('principios',next);
    setNuevoPrincipio('');setNuevoPrincipioDesc('');
  };
  const quitarPrincipio=async(idx)=>{
    const next=principios.filter((_,i)=>i!==idx);
    setPrincipios(next);
    await guardar('principios',next);
  };
  return(<div>
    <div className="page-header"><h1>Direccionamiento Estratégico</h1></div>
    <div className="card">
      <h3>Misión</h3>
      {isAdmin
        ?<textarea rows={3} value={mision} onChange={e=>setMision(e.target.value)} onBlur={()=>guardar('mision',mision)} placeholder="¿Para qué existe la entidad?" style={{width:'100%',padding:'0.75rem',border:'2px solid #E5E7EB',borderRadius:'8px',fontSize:'1rem'}}/>
        :<p style={{color:'#374151'}}>{mision||'Sin definir.'}</p>}
    </div>
    <div className="card">
      <h3>Visión</h3>
      {isAdmin
        ?<textarea rows={3} value={vision} onChange={e=>setVision(e.target.value)} onBlur={()=>guardar('vision',vision)} placeholder="¿Qué quiere ser la entidad en el horizonte del plan?" style={{width:'100%',padding:'0.75rem',border:'2px solid #E5E7EB',borderRadius:'8px',fontSize:'1rem'}}/>
        :<p style={{color:'#374151'}}>{vision||'Sin definir.'}</p>}
    </div>
    <div className="card">
      <h3>Valores</h3>
      {valores.length===0&&<p style={{color:'#6B7280'}}>Sin valores definidos aún.</p>}
      {valores.map((v,idx)=>(
        <div key={idx} style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.75rem',padding:'0.6rem 0',borderTop:idx>0?'1px solid #E5E7EB':'none'}}>
          <div><strong>{v.nombre}</strong>{v.descripcion&&<span style={{color:'#6B7280'}}> — {v.descripcion}</span>}</div>
          {isAdmin&&<button className="btn-secondary" onClick={()=>quitarValor(idx)}>🗑️</button>}
        </div>
      ))}
      {isAdmin&&<form onSubmit={agregarValor} style={{display:'flex',gap:'0.5rem',marginTop:'1rem',flexWrap:'wrap'}}>
        <input style={{flex:'1 1 180px',padding:'0.6rem',border:'2px solid #E5E7EB',borderRadius:'8px'}} value={nuevoValor} onChange={e=>setNuevoValor(e.target.value)} placeholder="Valor (ej. Transparencia)"/>
        <input style={{flex:'2 1 260px',padding:'0.6rem',border:'2px solid #E5E7EB',borderRadius:'8px'}} value={nuevoDesc} onChange={e=>setNuevoDesc(e.target.value)} placeholder="Descripción breve (opcional)"/>
        <button type="submit" className="btn-primary" style={{width:'auto'}} disabled={loading}>+ Agregar</button>
      </form>}
    </div>
    <div className="card">
      <h3>Principios</h3>
      {principios.length===0&&<p style={{color:'#6B7280'}}>Sin principios definidos aún.</p>}
      {principios.map((p,idx)=>(
        <div key={idx} style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'0.75rem',padding:'0.6rem 0',borderTop:idx>0?'1px solid #E5E7EB':'none'}}>
          <div><strong>{p.nombre}</strong>{p.descripcion&&<span style={{color:'#6B7280'}}> — {p.descripcion}</span>}</div>
          {isAdmin&&<button className="btn-secondary" onClick={()=>quitarPrincipio(idx)}>🗑️</button>}
        </div>
      ))}
      {isAdmin&&<form onSubmit={agregarPrincipio} style={{display:'flex',gap:'0.5rem',marginTop:'1rem',flexWrap:'wrap'}}>
        <input style={{flex:'1 1 180px',padding:'0.6rem',border:'2px solid #E5E7EB',borderRadius:'8px'}} value={nuevoPrincipio} onChange={e=>setNuevoPrincipio(e.target.value)} placeholder="Principio (ej. Buena fe)"/>
        <input style={{flex:'2 1 260px',padding:'0.6rem',border:'2px solid #E5E7EB',borderRadius:'8px'}} value={nuevoPrincipioDesc} onChange={e=>setNuevoPrincipioDesc(e.target.value)} placeholder="Descripción breve (opcional)"/>
        <button type="submit" className="btn-primary" style={{width:'auto'}} disabled={loading}>+ Agregar</button>
      </form>}
    </div>
  </div>);
};

const VistaConfig=({user,entidad,datos,isAdmin})=>{
  const[modal,setModal]=useState(null);
  const[form,setForm]=useState({});
  const[itemEdit,setItemEdit]=useState(null);
  const[loading,setLoading]=useState(false);
  const[busquedaPOA,setBusquedaPOA]=useState('');
  const[modalPrint,setModalPrint]=useState(false);
  if(!entidad||!datos)return <div className="empty-state"><h3>Selecciona un periodo PE</h3></div>;
  const{ejes=[],objetivos=[],estrategias=[],indicadores=[]}=datos;
  const ref=db.collection('coonecta_datos').doc(entidad.id);
  const scoreConfig=entidad.scoreConfig||{critico:{min:0,max:60},precaucion:{min:61,max:85},optimo:{min:86,max:100}};

  const guardarEje=async(e)=>{e.preventDefault();setLoading(true);try{if(itemEdit){await ref.collection('ejes').doc(itemEdit.id).update(form);}else{await ref.collection('ejes').add(form);}setModal(null);setForm({});setItemEdit(null);}catch(error){alert('Error: '+error.message);}finally{setLoading(false);}};
  const guardarObjetivo=async(e)=>{e.preventDefault();setLoading(true);try{if(itemEdit){await ref.collection('objetivos').doc(itemEdit.id).update(form);}else{await ref.collection('objetivos').add(form);}setModal(null);setForm({});setItemEdit(null);}catch(error){alert('Error: '+error.message);}finally{setLoading(false);}};
  const guardarEstrategia=async(e)=>{e.preventDefault();setLoading(true);try{const data={objetivoId:form.objetivoId,nombre:form.nombre};if(itemEdit){await ref.collection('estrategias').doc(itemEdit.id).update(data);}else{await ref.collection('estrategias').add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}setModal(null);setForm({});setItemEdit(null);}catch(error){alert('Error: '+error.message);}finally{setLoading(false);}};

  const getPeriodosPorPeriodicidad=(per)=>{
    if(per==='mensual')return['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
    if(per==='trimestral')return['T1 (Ene-Mar)','T2 (Abr-Jun)','T3 (Jul-Sep)','T4 (Oct-Dic)'];
    if(per==='semestral')return['Semestral 1','Semestral 2'];
    return[]; // anual — solo meta anual
  };
  const guardarIndicador=async(e)=>{
    e.preventDefault();
    setLoading(true);
    try{
      const metasPorAnio={};
      const metasMensuales={};
      if(form.anios){
        form.anios.split(',').forEach(a=>{
          const anio=a.trim();
          if(!anio)return;
          metasPorAnio[anio]=parseFloat(form[`meta_${anio}`]||form.meta);
          // Metas por periodo según periodicidad
          const periodos=getPeriodosPorPeriodicidad(form.periodicidad);
          metasMensuales[anio]={};
          periodos.forEach(mes=>{
            const key=`metames_${anio}_${mes}`;
            if(form[key]!==undefined&&form[key]!=='')
              metasMensuales[anio][mes]=parseFloat(form[key]);
          });
        });
      }
      const updateData={
        objetivoId:String(form.objetivoId),
        estrategiaId:String(form.estrategiaId||''),
        nombre:String(form.nombre),
        tipo:String(form.tipo),
        periodicidad:String(form.periodicidad),
        meta:parseFloat(form.meta),
        unidad:String(form.unidad),
        estrategia:String(form.estrategia||''),tipoMeta:String(form.tipoMeta||'independiente'),
        metasPorAnio:metasPorAnio,
        metasMensuales:metasMensuales,
        cargoResponsable:String(form.cargoResponsable||'')
      };
      if(itemEdit){
        updateData.updatedAt=firebase.firestore.FieldValue.serverTimestamp();
        await ref.collection('indicadores').doc(itemEdit.id).set(updateData,{merge:true});
      }else{
        await ref.collection('indicadores').add(updateData);
      }
      setModal(null);
      setForm({});
      setItemEdit(null);
    }catch(error){
      console.error('Error:',error);
      alert('Error: '+error.message);
    }finally{
      setLoading(false);
    }
  };

  const eliminar=async(coleccion,id)=>{if(!window.confirm('¿Eliminar?'))return;try{await ref.collection(coleccion).doc(id).delete();}catch(error){alert('Error: '+error.message);}};
  const editarEje=(eje)=>{setItemEdit(eje);setForm({nombre:eje.nombre,color:eje.color});setModal('eje');};
  const editarObjetivo=(obj)=>{setItemEdit(obj);setForm({ejeId:obj.ejeId,nombre:obj.nombre});setModal('objetivo');};
  const editarEstrategia=(est)=>{setItemEdit(est);setForm({objetivoId:est.objetivoId,nombre:est.nombre});setModal('estrategia');};
  const editarIndicador=(ind)=>{
    setItemEdit(ind);
    const anios=ind.metasPorAnio?Object.keys(ind.metasPorAnio).join(','):'';
    const formData={objetivoId:ind.objetivoId,estrategiaId:ind.estrategiaId||'',nombre:ind.nombre,tipo:ind.tipo,periodicidad:ind.periodicidad,meta:ind.meta,unidad:ind.unidad,estrategia:ind.estrategia||'',tipoMeta:ind.tipoMeta||'independiente',anios,cargoResponsable:ind.cargoResponsable||''};
    if(ind.metasPorAnio){Object.entries(ind.metasPorAnio).forEach(([anio,meta])=>{formData[`meta_${anio}`]=meta;});}
    setForm(formData);
    setModal('indicador');
  };

  const estrategiasDeObjetivo=(objId)=>estrategias.filter(es=>es.objetivoId===objId);

  return(<div>
    <div className="page-header"><h1>Planeación - {entidad.nombre}</h1><button className="btn-primary" onClick={()=>setModalPrint(true)} style={{width:'auto'}}>🖨️ Imprimir</button></div>

    <div className="card">
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
        <h3>Ejes Estratégicos ({ejes.length})</h3>
        <button className="btn-primary" style={{width:'auto'}} onClick={()=>{setItemEdit(null);setForm({nombre:'',color:'#A5C139'});setModal('eje');}}>+ Nuevo Eje</button>
      </div>
      {ejes.length===0?<p style={{color:'#6B7280'}}>No hay ejes</p>:<div className="grid">{ejes.map(eje=>(

// Función para formatear y mostrar tareas
const formatearTareas=(texto,limite=null)=>{
  if(!texto)return null;
  const lineas=texto.split('\n').filter(l=>l.trim());
  const tareas=lineas.map(l=>l.trim().replace(/^[-•*]\s*/,''));
  
  if(limite&&tareas.length>limite){
    const mostrar=tareas.slice(0,limite);
    const resto=tareas.length-limite;
    return(<div>
      {mostrar.map((t,i)=><div key={i} style={{fontSize:'0.85rem',color:'#6B7280',marginBottom:'0.15rem'}}>• {t}</div>)}
      <div style={{fontSize:'0.75rem',color:'#9CA3AF',marginTop:'0.25rem'}}>... (+{resto} más)</div>
    </div>);
  }
  
  return(<div>
    {tareas.map((t,i)=><div key={i} style={{fontSize:'0.85rem',color:'#6B7280',marginBottom:'0.25rem'}}>• {t}</div>)}
  </div>);
};

// ── Funciones globales de cálculo POA ──
const getMesesRango=(inicio,fin)=>{
  if(!inicio||!fin)return[];
  const meses=[];
  const nombresMes=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  let [ay,am]=inicio.split('-').map(Number);
  const [fy,fm]=fin.split('-').map(Number);
  while(ay<fy||(ay===fy&&am<=fm)){
    meses.push({key:`${ay}-${String(am).padStart(2,'0')}`,label:`${nombresMes[am-1]} ${ay}`,anio:ay,mes:am});
    am++;if(am>12){am=1;ay++;}
  }
  return meses;
};
const calcAvanceActividad=(act)=>{
  if(act.estado==='Completada'||act.estado==='Completado')return 100;
  if(act.estado==='Cancelada'||act.estado==='Programada')return 0;
  const meses=getMesesRango(act.fechaInicio,act.fechaFin);
  if(meses.length===0)return 0;
  const porMes=100/meses.length;
  const registrados=(act.seguimientoMensual||{});
  const mesesConRegistro=meses.filter(m=>registrados[m.key]&&registrados[m.key].observacion).length;
  return Math.round(mesesConRegistro*porMes);
};
const calcAvancePOA=(acts)=>{
  if(acts.length===0)return 0;
  const suma=acts.reduce((acc,a)=>acc+calcAvanceActividad(a),0);
  return Math.round(suma/acts.length);
};

const vrioTier=(v,r,i,o)=>{
  if(v&&r&&i&&o)return{label:'Ventaja sostenida',color:'#059669',bg:'#D1FAE5',accion:null};
  if(v&&r&&i&&!o)return{label:'Ventaja sin explotar',color:'#A5C139',bg:'#FFE5E5',accion:'incrementar'};
  if(v&&r&&!i)return{label:'Ventaja temporal',color:'#B45309',bg:'#FEF3C7',accion:'incrementar'};
  if(v&&!r)return{label:'Paridad competitiva',color:'#6B7280',bg:'#F3F4F6',accion:'reducir'};
  return{label:'Desventaja competitiva',color:'#991B1B',bg:'#FEE2E2',accion:'eliminar'};
};
const agruparSintesis=(eric)=>{
  const candidatas=eric.filter(e=>e.accion==='incrementar'||e.accion==='crear');
  const grupos={};const sueltas=[];
  candidatas.forEach(e=>{
    if(e.lineaPropuesta&&e.lineaPropuesta.trim()){(grupos[e.lineaPropuesta]=grupos[e.lineaPropuesta]||[]).push(e);}
    else sueltas.push(e);
  });
  return{grupos,sueltas};
};
const contrasteDecision=(relevante,capacidad,cumplimiento)=>{
  const c=Number(cumplimiento)||0;
  if(relevante==='no')return{label:'Reemplazar',color:'#991B1B',bg:'#FEE2E2'};
  if(relevante==='si'&&capacidad==='si'&&c>=70)return{label:'Mantener',color:'#059669',bg:'#D1FAE5'};
  return{label:'Ajustar',color:'#B45309',bg:'#FEF3C7'};
};

const BMC_LABEL=Object.fromEntries(BMC_BLOCKS.map(b=>[b.key,b.label]));
const ERIC_QUADS=[
  {key:'eliminar',label:'Eliminar',emoji:'🗑️',color:'#991B1B',bg:'#FEE2E2',hint:'¿Qué ya no aporta valor?'},
  {key:'reducir',label:'Reducir',emoji:'✂️',color:'#B45309',bg:'#FEF3C7',hint:'¿Qué se hace en exceso?'},
  {key:'incrementar',label:'Incrementar',emoji:'📈',color:'#A5C139',bg:'#FFE5E5',hint:'¿Qué merece más atención?'},
  {key:'crear',label:'Crear',emoji:'✨',color:'#059669',bg:'#D1FAE5',hint:'¿Qué no existe hoy?'},
];
const ERIC_LABEL=Object.fromEntries(ERIC_QUADS.map(q=>[q.key,q]));
const PESTEL_DIMS=[{key:'politico',label:'Político',emoji:'🏛️'},{key:'economico',label:'Económico',emoji:'💰'},{key:'social',label:'Social',emoji:'👥'},{key:'tecnologico',label:'Tecnológico',emoji:'💻'},{key:'ecologico',label:'Ecológico',emoji:'🌿'},{key:'legal',label:'Legal',emoji:'⚖️'}];

const Chip=({color,bg,children})=>(<span style={{display:'inline-flex',alignItems:'center',gap:4,padding:'0.2rem 0.65rem',borderRadius:999,fontSize:'0.75rem',fontWeight:700,color,background:bg,whiteSpace:'nowrap'}}>{children}</span>);

const descargarBlob=(blob,filename)=>{
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);
  URL.revokeObjectURL(url);
};

const exportarWordAnalisis=async(entidad,vrio,contraste,pestel,bmc,eric,areaLabel)=>{
  const{Document,Packer,Paragraph,TextRun,HeadingLevel,Table,TableRow,TableCell,WidthType,ShadingType}=window.docx;
  const H1=(t)=>new Paragraph({heading:HeadingLevel.HEADING_1,spacing:{before:300,after:150},children:[new TextRun({text:t,bold:true,color:'4C1D95'})]});
  const P=(t)=>new Paragraph({spacing:{after:120},children:[new TextRun({text:t})]});
  const cell=(t,header)=>new TableCell({width:{size:2500,type:WidthType.DXA},shading:header?{type:ShadingType.CLEAR,fill:'4F46E5'}:undefined,margins:{top:80,bottom:80,left:100,right:100},children:[new Paragraph({children:[new TextRun({text:String(t==null?'':t),bold:!!header,color:header?'FFFFFF':'000000'})]})]});
  const tabla=(headers,rows)=>new Table({width:{size:10000,type:WidthType.DXA},rows:[new TableRow({children:headers.map(h=>cell(h,true))}),...rows.map(r=>new TableRow({children:r.map(v=>cell(v))}))]});

  const vrioRows=vrio.map(v=>{const t=vrioTier(v.valioso,v.raro,v.inimitable,v.organizado);return[v.area,v.recurso,t.label];});
  const contrasteRows=contraste.map(c=>{const d=contrasteDecision(c.relevante,c.capacidad,c.cumplimiento);return[c.area,c.linea,d.label];});
  const pestelRows=pestel.map(p=>[p.area,PESTEL_DIMS.find(d=>d.key===p.dimension)?.label||'',p.factor,p.tipo==='oportunidad'?'Oportunidad':'Amenaza']);
  const bmcRows=bmc.map(b=>[b.area,BMC_LABEL[b.bloque],b.texto]);
  const ericRows=eric.map(e=>[e.area,ERIC_LABEL[e.accion]?.label||'',e.texto,e.lineaPropuesta||'']);
  const{grupos:sintesisGrupos,sueltas:sintesisSueltas}=agruparSintesis(eric);
  const sintesisChildren=[];
  Object.entries(sintesisGrupos).forEach(([nombre,items])=>{
    sintesisChildren.push(new Paragraph({spacing:{before:160,after:60},children:[new TextRun({text:'🎯 '+nombre,bold:true,color:'4F46E5'})]}));
    items.forEach(it=>sintesisChildren.push(P('• ['+(ERIC_LABEL[it.accion]?.label||'')+'] '+it.texto+' ('+it.area+')')));
  });
  if(sintesisSueltas.length>0){
    sintesisChildren.push(new Paragraph({spacing:{before:160,after:60},children:[new TextRun({text:'Ideas sin agrupar',bold:true,color:'6B7280'})]}));
    sintesisSueltas.forEach(it=>sintesisChildren.push(P('• ['+(ERIC_LABEL[it.accion]?.label||'')+'] '+it.texto+(it.lineaPropuesta?' — '+it.lineaPropuesta:'')+' ('+it.area+')')));
  }
  if(sintesisChildren.length===0)sintesisChildren.push(P('Sin líneas candidatas todavía.'));

  const doc_=new Document({sections:[{children:[
    new Paragraph({heading:HeadingLevel.TITLE,children:[new TextRun({text:'Análisis y Diagnóstico — '+entidad.nombre,bold:true,color:'4C1D95'})]}),
    P('Ámbito: '+(areaLabel||'Todas las áreas')),
    H1('VRIO'),vrio.length?tabla(['Área','Recurso','Clasificación'],vrioRows):P('Sin registros.'),
    H1('Matriz de contraste'),contraste.length?tabla(['Área','Línea vigente','Decisión'],contrasteRows):P('Sin registros.'),
    H1('PESTEL'),pestel.length?tabla(['Área','Dimensión','Factor','Tipo'],pestelRows):P('Sin registros.'),
    H1('Business Model Canvas'),bmc.length?tabla(['Área','Bloque','Nota'],bmcRows):P('Sin registros.'),
    H1('ERIC al Canvas'),eric.length?tabla(['Área','Acción','Idea','Línea propuesta'],ericRows):P('Sin registros.'),
    H1('Síntesis — líneas estratégicas candidatas'),...sintesisChildren,
  ]}]});
  const blob=await Packer.toBlob(doc_);
  descargarBlob(blob,'AnalisisDiagnostico_'+entidad.nombre.replace(/\s+/g,'_')+'.docx');
};

const exportarExcelAnalisis=(entidad,vrio,contraste,pestel,bmc,eric)=>{
  const wb=XLSX.utils.book_new();
  const vrioRows=vrio.map(v=>({Área:v.area,Cargo:v.cargo||'',Recurso:v.recurso,Descripción:v.descripcion,Valioso:v.valioso?'Sí':'No',Raro:v.raro?'Sí':'No',Inimitable:v.inimitable?'Sí':'No',Organizado:v.organizado?'Sí':'No',Clasificación:vrioTier(v.valioso,v.raro,v.inimitable,v.organizado).label}));
  const contrasteRows=contraste.map(c=>({Área:c.area,Cargo:c.cargo||'','Línea vigente':c.linea,'Relevante externamente':c.relevante,'Capacidad interna':c.capacidad,'% Cumplimiento':c.cumplimiento,Decisión:contrasteDecision(c.relevante,c.capacidad,c.cumplimiento).label}));
  const pestelRows=pestel.map(p=>({Área:p.area,Cargo:p.cargo||'',Dimensión:PESTEL_DIMS.find(d=>d.key===p.dimension)?.label,Factor:p.factor,Impacto:p.impacto,Probabilidad:p.probabilidad,Tipo:p.tipo==='oportunidad'?'Oportunidad':'Amenaza'}));
  const bmcRows=bmc.map(b=>({Área:b.area,Cargo:b.cargo||'',Bloque:BMC_LABEL[b.bloque],Nota:b.texto,'Enlazado a':b.origenLabel||''}));
  const ericRows=eric.map(e=>({Área:e.area,Cargo:e.cargo||'',Acción:ERIC_LABEL[e.accion]?.label,Idea:e.texto,'Enlazado a':e.refLabel||'','Línea propuesta':e.lineaPropuesta||''}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(vrioRows),'VRIO');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(contrasteRows),'Matriz de contraste');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(pestelRows),'PESTEL');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(bmcRows),'Business Model Canvas');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(ericRows),'ERIC y líneas');
  const{grupos:sintesisGruposXls,sueltas:sintesisSueltasXls}=agruparSintesis(eric);
  const sintesisRows=[];
  Object.entries(sintesisGruposXls).forEach(([nombre,items])=>{
    items.forEach(it=>sintesisRows.push({'Línea estratégica':nombre,Área:it.area,Acción:ERIC_LABEL[it.accion]?.label,Idea:it.texto}));
  });
  sintesisSueltasXls.forEach(it=>sintesisRows.push({'Línea estratégica':it.lineaPropuesta||'(sin agrupar)',Área:it.area,Acción:ERIC_LABEL[it.accion]?.label,Idea:it.texto}));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(sintesisRows),'Síntesis');
  XLSX.writeFile(wb,'AnalisisDiagnostico_'+entidad.nombre.replace(/\s+/g,'_')+'.xlsx');
};

const TRANSVERSAL='Transversal / Corporativo';

const VistaAnalisis=({entidad,isAdmin,isMonitoreo,userCargo,user})=>{
  const[sub,setSub]=useState('vrio');
  const[cargos,setCargos]=useState([]);
  const[areaActiva,setAreaActiva]=useState('');
  const[modalPrint,setModalPrint]=useState(false);
  const[exportando,setExportando]=useState(false);
  const[cargandoEjemplo,setCargandoEjemplo]=useState(false);
  const[vrio,setVrio]=useState([]);
  const[contraste,setContraste]=useState([]);
  const[pestel,setPestel]=useState([]);
  const[bmc,setBmc]=useState([]);
  const[eric,setEric]=useState([]);
  const canEdit=isAdmin||!isMonitoreo;
  const canEditEntry=(entry)=>isAdmin||(entry?.autorUid&&entry.autorUid===user?.uid);
  useEffect(()=>{
    const unsub=db.collection('coonecta_cargos').onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      setCargos(d);
    });
    return()=>unsub();
  },[]);
  const areasExistentes=[...new Set([...cargos.map(c=>c.area).filter(Boolean),TRANSVERSAL])].sort();
  const miCargo=cargos.find(c=>c.nombre===userCargo);
  const miArea=miCargo?miCargo.area:'';
  const areaFiltro=isAdmin?(areaActiva||null):(miArea||null);


  useEffect(()=>{
    if(!entidad)return;
    const ref=db.collection('coonecta_datos').doc(entidad.id);
    const creadoMs=(d)=>{
      if(!d.creado)return Date.now();
      if(typeof d.creado.toMillis==='function')return d.creado.toMillis();
      if(d.creado.seconds)return d.creado.seconds*1000;
      return 0;
    };
    const ordenar=(arr)=>[...arr].sort((a,b)=>creadoMs(b)-creadoMs(a));
    const withArea=(coll,setter)=>{
      // Nota: sin orderBy() en la consulta a propósito, para no requerir un índice
      // compuesto en Firestore. El orden se aplica aquí mismo, en el navegador.
      if(!areaFiltro){
        return ref.collection(coll).onSnapshot(s=>{setter(ordenar(s.docs.map(d=>({id:d.id,...d.data()}))));});
      }
      let dataA=[],dataB=[];
      const merge=()=>{const map={};[...dataA,...dataB].forEach(d=>map[d.id]=d);setter(ordenar(Object.values(map)));};
      const u1=ref.collection(coll).where('area','==',areaFiltro).onSnapshot(s=>{dataA=s.docs.map(d=>({id:d.id,...d.data()}));merge();});
      const u2=ref.collection(coll).where('area','==',TRANSVERSAL).onSnapshot(s=>{dataB=s.docs.map(d=>({id:d.id,...d.data()}));merge();});
      return()=>{u1();u2();};
    };
    const u1=withArea('vrio',setVrio),u2=withArea('contraste',setContraste),u3=withArea('pestel',setPestel),u4=withArea('bmc',setBmc),u5=withArea('eric',setEric);
    return()=>{u1();u2();u3();u4();u5();};
  },[entidad,areaFiltro]);

  if(!entidad)return <div className="empty-state"><h3>Selecciona un periodo PE</h3></div>;
  if(!isAdmin&&!userCargo)return <div className="empty-state"><h3>🏷️ Sin cargo asignado</h3><p>Tu usuario todavía no tiene un cargo asignado en esta entidad. Pide al administrador que te lo asigne desde "Usuarios" para poder ver y registrar la información de tu área.</p></div>;
  if(!isAdmin&&userCargo&&!miArea)return <div className="empty-state"><h3>🗂️ Tu cargo no tiene área asignada</h3><p>Tu cargo (<strong>{userCargo}</strong>) existe, pero todavía no está asociado a un área. Pide al administrador que complete el campo "Área" para ese cargo desde el menú "Cargos".</p></div>;

  const ref=db.collection('coonecta_datos').doc(entidad.id);
  const add=(coll,data)=>ref.collection(coll).add({...data,autorUid:user?.uid||'',autorNombre:user?.displayName||user?.email||'',autorCargo:userCargo||'',createdAt:firebase.firestore.FieldValue.serverTimestamp()});
  const remove=(coll,id)=>{if(window.confirm('¿Eliminar?'))ref.collection(coll).doc(id).delete();};
  const update=(coll,id,data)=>ref.collection(coll).doc(id).update(data);

  const SUBTABS=[
    {key:'vrio',label:'🧬 VRIO'},{key:'contraste',label:'📋 Matriz de contraste'},{key:'pestel',label:'🌬️ PESTEL'},
    {key:'bmc',label:'🗂️ Business Model Canvas'},{key:'eric',label:'🔧 ERIC al Canvas'},
    ...(isAdmin?[{key:'sintesis',label:'🔗 Síntesis'},{key:'canvas_consolidado',label:'🗂️ Canvas Final'}]:[]),
  ];

  const areaTag=isAdmin?areaActiva:miArea;
  const cargoTag=isAdmin?'':userCargo;
  const areaLabelActual=isAdmin?(areaActiva||'Todas las áreas'):miArea;

  const onWord=async()=>{
    setExportando(true);
    try{await exportarWordAnalisis(entidad,vrio,contraste,pestel,bmc,eric,areaLabelActual);}
    catch(err){alert('Error generando Word: '+err.message);}
    finally{setExportando(false);}
  };
  const onExcel=()=>{
    try{exportarExcelAnalisis(entidad,vrio,contraste,pestel,bmc,eric);}
    catch(err){alert('Error generando Excel: '+err.message);}
  };
  const onDatosEjemplo=async()=>{
    if(!window.confirm('¿Cargar datos de ejemplo en la entidad "'+entidad.nombre+'"? Esto agrega cargos, VRIO, PESTEL, Canvas y ERIC de muestra.'))return;
    setCargandoEjemplo(true);
    try{await cargarDatosEjemplo(entidad);alert('Datos de ejemplo cargados.');}
    catch(err){alert('Error: '+err.message);}
    finally{setCargandoEjemplo(false);}
  };

  return(<div>
    <div className="page-header">
      <h1>Análisis y Diagnóstico — {entidad.nombre}</h1>
      <div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap'}}>
        {typeof MODO_PRUEBA!=='undefined'&&MODO_PRUEBA&&isAdmin&&<button className="btn-secondary" onClick={onDatosEjemplo} disabled={cargandoEjemplo} style={{border:'2px solid #059669',color:'#059669'}}>🌱 {cargandoEjemplo?'Cargando...':'Datos de ejemplo'}</button>}
        <button className="btn-primary" style={{width:'auto'}} onClick={()=>setModalPrint(true)}>🖨️ Imprimir</button>
        <button className="btn-primary" style={{width:'auto'}} onClick={onWord} disabled={exportando}>📄 {exportando?'Generando...':'Word'}</button>
        <button className="btn-primary" style={{width:'auto'}} onClick={onExcel}>📊 Excel</button>
      </div>
    </div>
    <div style={{display:'flex',gap:'0.5rem',flexWrap:'wrap',marginBottom:'1.5rem'}}>
      {SUBTABS.map(t=>(
        <button key={t.key} onClick={()=>setSub(t.key)}
          style={{padding:'0.5rem 1rem',borderRadius:'8px',border:'2px solid '+(sub===t.key?'#A5C139':'#E5E7EB'),background:sub===t.key?'#FFE5E5':'white',color:sub===t.key?'#A5C139':'#4B5563',fontWeight:600,cursor:'pointer',fontSize:'0.875rem'}}>
          {t.label}
        </button>
      ))}
    </div>
    {!isAdmin&&<div className="card" style={{padding:'0.75rem 1rem',marginBottom:'1rem',background:'#F9FAFB'}}>
      <span style={{fontSize:'0.8rem',color:'#6B7280'}}>Tu cargo: </span><Chip color="#6B7280" bg="#F3F4F6">{userCargo}</Chip>
      <span style={{fontSize:'0.8rem',color:'#6B7280',marginLeft:8}}>→ Área: </span><Chip color="#A5C139" bg="#FFE5E5">🗂️ {miArea}</Chip>
      <span style={{fontSize:'0.75rem',color:'#9CA3AF',marginLeft:10}}>(también ves lo marcado como {TRANSVERSAL})</span>
      {!canEdit&&<span style={{marginLeft:8,fontSize:'0.8rem',color:'#6B7280'}}>(modo monitoreo — solo lectura)</span>}
    </div>}
    {isAdmin&&<div className="card" style={{padding:'0.75rem 1rem',marginBottom:'1rem',background:'#F9FAFB'}}>
      <div className="form-group" style={{marginBottom:0}}>
        <label>Área que registra / consulta (déjalo vacío para ver todas)</label>
        <input type="text" list="areas-analisis" value={areaActiva} onChange={e=>setAreaActiva(e.target.value)} placeholder="Ej. Riesgos, Talento Humano, Gerencia..."/>
        <datalist id="areas-analisis">{areasExistentes.map(a=><option key={a} value={a}/>)}</datalist>
      </div>
    </div>}

    {sub==='vrio'&&<AnalisisVrio entries={vrio} area={areaTag} cargo={cargoTag} isAdmin={isAdmin} canEdit={canEdit} userId={user?.uid} isAdmin={isAdmin} onAdd={d=>add('vrio',d)} onUpdate={(id,d)=>update('vrio',id,d)} onRemove={id=>remove('vrio',id)} onEric={d=>add('eric',d)}/>}
    {sub==='contraste'&&<AnalisisContraste entries={contraste} area={areaTag} cargo={cargoTag} canEdit={canEdit} userId={user?.uid} isAdmin={isAdmin} onAdd={d=>add('contraste',d)} onUpdate={(id,d)=>update('contraste',id,d)} onRemove={id=>remove('contraste',id)}/>}
    {sub==='pestel'&&<AnalisisPestel entries={pestel} area={areaTag} cargo={cargoTag} canEdit={canEdit} userId={user?.uid} isAdmin={isAdmin} onAdd={d=>add('pestel',d)} onUpdate={(id,d)=>update('pestel',id,d)} onRemove={id=>remove('pestel',id)}/>}
    {sub==='bmc'&&<AnalisisBmc entries={bmc} vrio={vrio} contraste={contraste} area={areaTag} cargo={cargoTag} canEdit={canEdit} userId={user?.uid} isAdmin={isAdmin} onAdd={d=>add('bmc',d)} onUpdate={(id,d)=>update('bmc',id,d)} onRemove={id=>remove('bmc',id)}/>}
    {sub==='eric'&&<AnalisisEric entries={eric} bmc={bmc} vrio={vrio} area={areaTag} cargo={cargoTag} canEdit={canEdit} userId={user?.uid} isAdmin={isAdmin} onAdd={d=>add('eric',d)} onUpdate={(id,d)=>update('eric',id,d)} onRemove={id=>remove('eric',id)}/>}

  const[text,setText]=useState('');const[refValue,setRefValue]=useState('');const[transversal,setTransversal]=useState(false);
