  const editar=(item)=>{setEditId(item.id);setEditArea(item.area||'');setText(item.texto);setRefValue(item.refTipo?item.refTipo+':'+item.refId:'');setTransversal(item.area===TRANSVERSAL);};
  const submit=(e)=>{e.preventDefault();if(!text.trim())return;
    const areaFinal=transversal?TRANSVERSAL:(area||editArea||'Sin asignar');
    let data={area:areaFinal,cargo:cargo||'',accion:quad.key,texto:text,refTipo:null,refId:null,refLabel:null,refBloque:null};
    if(refValue){const[tipo,id]=refValue.split(':');
      if(tipo==='bmc'){const n=bmc.find(x=>x.id===id);if(n){data.refTipo='bmc';data.refId=id;data.refBloque=n.bloque;data.refLabel=n.texto;}}
      if(tipo==='vrio'){const v=vrio.find(x=>x.id===id);if(v){data.refTipo='vrio';data.refId=id;data.refLabel=v.recurso;}}}
    if(editId)onUpdate(editId,data);else onAdd(data);
    limpiar();};
  return(<div className="card">
    <h4 style={{color:quad.color}}>{quad.emoji} {quad.label}</h4>
    <p style={{color:'#6B7280',fontSize:'0.8rem'}}>{quad.hint}</p>
    <div style={{display:'flex',flexDirection:'column',gap:6,maxHeight:170,overflowY:'auto',margin:'0.5rem 0'}}>
      {entries.length===0&&<span style={{fontSize:'0.75rem',color:'#9CA3AF'}}>Sin ideas registradas.</span>}
      {entries.map(e=>(<div key={e.id} style={{background:quad.bg,borderRadius:8,padding:'0.5rem 0.7rem',fontSize:'0.8rem',display:'flex',justifyContent:'space-between',gap:8}}>
        <div><div>{e.texto}</div><div style={{opacity:0.7,fontSize:'0.7rem'}}>🗂️ {e.area}{e.refLabel&&<span> · 🔗 {e.refTipo==='bmc'?BMC_LABEL[e.refBloque]+': ':'VRIO: '}{e.refLabel}</span>}{e.lineaPropuesta&&<span> · 🎯 {e.lineaPropuesta}</span>}{e.autorNombre&&<span> · ✍️ {e.autorNombre}</span>}</div></div>
        {(isAdmin||(e?.autorUid&&e.autorUid===userId))&&<div style={{display:'flex',flexDirection:'column',gap:2}}><button onClick={()=>editar(e)} style={{background:'none',border:'none',cursor:'pointer',opacity:0.6}}>✏️</button><button onClick={()=>onRemove(e.id)} style={{background:'none',border:'none',cursor:'pointer',opacity:0.5}}>🗑️</button></div>}
      </div>))}
    </div>
    {canEdit&&<form onSubmit={submit} style={{display:'flex',flexDirection:'column',gap:6}}>
      {editId&&<div style={{fontSize:'0.7rem',color:'#A5C139',fontWeight:600}}>✏️ Editando — <a href="#" onClick={ev=>{ev.preventDefault();limpiar();}} style={{color:'#6B7280',fontWeight:400}}>cancelar</a></div>}
      <select value={refValue} onChange={e=>setRefValue(e.target.value)} style={{fontSize:'0.7rem',padding:'0.3rem',border:'1px solid #E5E7EB',borderRadius:6}}>
        <option value="">Enlazar a (opcional)...</option>
        {bmc.length>0&&<optgroup label="Notas del Canvas">{bmc.map(n=><option key={n.id} value={'bmc:'+n.id}>{BMC_LABEL[n.bloque]}: {n.texto}</option>)}</optgroup>}
        {vrio.length>0&&<optgroup label="Recursos VRIO">{vrio.map(v=><option key={v.id} value={'vrio:'+v.id}>{v.recurso}</option>)}</optgroup>}
      </select>
      <div style={{display:'flex',gap:6}}>
        <input value={text} onChange={e=>setText(e.target.value)} placeholder={'Idea para '+quad.label.toLowerCase()+'...'} disabled={!editId&&!area&&!transversal} style={{flex:1,fontSize:'0.8rem',padding:'0.4rem 0.6rem',border:'1px solid #E5E7EB',borderRadius:6}}/>
        <button type="submit" disabled={!editId&&!area&&!transversal} style={{borderRadius:6,padding:'0 0.8rem',background:'#A5C139',color:'white',border:'none',cursor:'pointer'}}>{editId?'💾':'+'}</button>
      </div>
      {!area&&!transversal&&<span style={{fontSize:'0.7rem',color:'#DC2626'}}>Selecciona un área arriba primero.</span>}
      {isAdmin&&<TransversalCheck checked={transversal} onChange={setTransversal}/>}
    </form>}
  </div>);
};

const AnalisisSintesis=({eric,bmc,onUpdate})=>{
  const candidatas=eric.filter(e=>e.accion==='incrementar'||e.accion==='crear');
  const[seleccion,setSeleccion]=useState([]);
  const[nombreGrupo,setNombreGrupo]=useState('');

  const grupos={};const sueltas=[];
  candidatas.forEach(e=>{
    if(e.lineaPropuesta&&e.lineaPropuesta.trim()){
      (grupos[e.lineaPropuesta]=grupos[e.lineaPropuesta]||[]).push(e);
    }else sueltas.push(e);
  });

  const toggleSel=(id)=>setSeleccion(s=>s.includes(id)?s.filter(x=>x!==id):[...s,id]);
  const agrupar=async(e)=>{
    e.preventDefault();
    if(!nombreGrupo.trim()||seleccion.length===0)return;
    for(const id of seleccion)await onUpdate(id,{lineaPropuesta:nombreGrupo});
    setSeleccion([]);setNombreGrupo('');
  };
  const desagrupar=async(id)=>{await onUpdate(id,{lineaPropuesta:''});};
  const renombrarGrupo=async(nombreViejo,nombreNuevo)=>{
    if(!nombreNuevo.trim()||nombreNuevo===nombreViejo)return;
    for(const it of grupos[nombreViejo])await onUpdate(it.id,{lineaPropuesta:nombreNuevo});
  };

  const Tarjeta=({e})=>{
    const quad=ERIC_LABEL[e.accion];
    const notaBmc=e.refTipo==='bmc'?bmc.find(n=>n.id===e.refId):null;
    return(
      <div style={{display:'flex',alignItems:'flex-start',gap:8,padding:'0.5rem 0',borderTop:'1px solid #F3F4F6'}}>
        <input type="checkbox" checked={seleccion.includes(e.id)} onChange={()=>toggleSel(e.id)} style={{marginTop:4}}/>
        <div style={{flex:1}}>
          <div style={{display:'flex',gap:6,flexWrap:'wrap',alignItems:'center',marginBottom:4}}>
            {e.refTipo==='vrio'&&<Chip color="#B45309" bg="#FEF3C7">VRIO: {e.refLabel}</Chip>}
            {notaBmc&&<Chip color="#A5C139" bg="#FFE5E5">{BMC_LABEL[notaBmc.bloque]}: {notaBmc.texto}</Chip>}
            <Chip color={quad.color} bg={quad.bg}>{quad.label}: {e.texto}</Chip>
            <Chip color="#6B7280" bg="#F3F4F6">🗂️ {e.area}</Chip>
          </div>
          {e.lineaPropuesta&&<button onClick={()=>desagrupar(e.id)} style={{fontSize:'0.7rem',color:'#DC2626',background:'none',border:'none',cursor:'pointer',textDecoration:'underline'}}>Quitar del grupo</button>}
        </div>
      </div>
    );
  };

  return(<div style={{display:'flex',flexDirection:'column',gap:'1.5rem'}}>
    <p style={{color:'#6B7280'}}>Marca varias ideas de Incrementar/Crear y agrúpalas en una sola línea estratégica cuando en realidad son la misma idea. Las que dejes sueltas quedan como candidatas independientes.</p>

    {seleccion.length>0&&<form onSubmit={agrupar} className="card" style={{background:'#FFE5E5',display:'flex',gap:'0.5rem',flexWrap:'wrap',alignItems:'flex-end'}}>
      <div className="form-group" style={{flex:'1 1 260px',marginBottom:0}}>
        <label>Nombre de línea estratégica para las {seleccion.length} ideas seleccionadas</label>
        <input value={nombreGrupo} onChange={e=>setNombreGrupo(e.target.value)} placeholder="Ej. Fortalecimiento del canal digital de servicio"/>
      </div>
      <button type="submit" className="btn-primary" style={{width:'auto'}}>Agrupar seleccionadas</button>
      <button type="button" className="btn-secondary" style={{width:'auto'}} onClick={()=>setSeleccion([])}>Cancelar selección</button>
    </form>}

    {Object.keys(grupos).length===0&&sueltas.length===0&&<p style={{color:'#6B7280'}}>Aún no hay ideas de tipo Incrementar o Crear.</p>}

    {Object.entries(grupos).map(([nombre,items])=>(
      <div key={nombre} className="card" style={{borderLeft:'4px solid #A5C139'}}>
        <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:4}}>
          <span style={{fontSize:'1.5rem'}}>🎯</span>
          <input defaultValue={nombre} onBlur={ev=>renombrarGrupo(nombre,ev.target.value)} style={{fontWeight:700,fontSize:'1rem',border:'none',borderBottom:'2px solid transparent',padding:'0.2rem 0'}} onFocus={ev=>ev.target.style.borderBottom='2px solid #A5C139'}/>
          <span style={{fontSize:'0.75rem',color:'#6B7280'}}>({items.length} ideas agrupadas)</span>
        </div>
        {items.map(e=><Tarjeta key={e.id} e={e}/>)}
      </div>
    ))}

    {sueltas.length>0&&<div className="card">
      <h3 style={{fontSize:'1rem',marginBottom:4}}>Ideas sin agrupar</h3>
      {sueltas.map(e=>(
        <div key={e.id}>
          <Tarjeta e={e}/>
          <div style={{paddingLeft:26,paddingBottom:10}}>
            <input defaultValue={e.lineaPropuesta||''} onBlur={ev=>onUpdate(e.id,{lineaPropuesta:ev.target.value})} placeholder="Nombrar como línea independiente..." style={{width:'100%',maxWidth:420,padding:'0.4rem 0.6rem',border:'1px solid #E5E7EB',borderRadius:6,fontSize:'0.85rem'}}/>
          </div>
        </div>
      ))}
    </div>}
  </div>);
};
// ===================== FIN ANÁLISIS Y DIAGNÓSTICO =====================

const VistaPlanOperativo=({user,entidad,datos,isAdmin,isMonitoreo,userCargo})=>{
  const[vista,setVista]=useState('planes');
  const[planSel,setPlanSel]=useState(null);
  const[planes,setPlanes]=useState([]);
  const[actividades,setActividades]=useState([]);
  const[modalPlan,setModalPlan]=useState(false);
  const[modalActividad,setModalActividad]=useState(false);
  const[modalSeguimiento,setModalSeguimiento]=useState(null);
  const[modalScore,setModalScore]=useState(false);
  const[todasActividades,setTodasActividades]=useState([]);
  const[formPlan,setFormPlan]=useState({});
  const[formActividad,setFormActividad]=useState({});
  const[itemEdit,setItemEdit]=useState(null);
  const[loading,setLoading]=useState(false);
  const[busquedaPOA,setBusquedaPOA]=useState('');
  const planesFiltrados=planes.filter(p=>{
    if(!p.nombre.toLowerCase().includes(busquedaPOA.toLowerCase()))return false;
    if(!isMonitoreo&&!isAdmin&&userCargo&&p.lider&&p.lider.trim().toLowerCase()!==userCargo.trim().toLowerCase())return false;
    return true;
  });
  
  
  
  useEffect(()=>{
    if(!entidad)return;
    const unsub=db.collection('coonecta_datos').doc(entidad.id).collection('poa_actividades').onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      setTodasActividades(d);
    });
    return()=>unsub();
  },[entidad]);
  useEffect(()=>{
    if(!entidad)return;
    const unsub=db.collection('coonecta_datos').doc(entidad.id).collection('planes_operativos').onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      d.sort((a,b)=>(b.anio||0)-(a.anio||0));
      setPlanes(d);
    });
    return()=>unsub();
  },[entidad]);
  
  useEffect(()=>{
    if(!entidad||!planSel)return;
    const unsub=db.collection('coonecta_datos').doc(entidad.id).collection('poa_actividades').where('planId','==',planSel.id).onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      d.sort((a,b)=>(a.fechaInicio||'').localeCompare(b.fechaInicio||''));
      setActividades(d);
    });
    return()=>unsub();
  },[entidad,planSel]);
  
  if(!entidad||!datos)return <div className="empty-state"><h3>Selecciona un periodo PE</h3></div>;
  const{ejes=[],objetivos=[]}=datos;
  
  const aprobarPlan=async(plan)=>{
    if(!window.confirm('¿Aprobar este POA? Quedará bloqueado para edición hasta que lo desbloquees.'))return;
    try{
      await db.collection('coonecta_datos').doc(entidad.id).collection('planes_operativos').doc(plan.id).update({
        aprobado:true,
        aprobadoPor:user.email,
        aprobadoAt:firebase.firestore.FieldValue.serverTimestamp()
      });
      setPlanSel(prev=>prev&&prev.id===plan.id?{...prev,aprobado:true}:prev);
    }catch(err){alert('Error al aprobar: '+err.message);}
  };
  const desbloquearPlan=async(plan)=>{
    if(!plan?.id){alert('Error: plan no identificado');return;}
    const ok=window.confirm('¿Desbloquear este POA? Solo hazlo con autorización de gerencia.');
    if(!ok)return;
    try{
      await db.collection('coonecta_datos').doc(entidad.id).collection('planes_operativos').doc(plan.id).update({
        aprobado:false,aprobadoPor:null,aprobadoAt:null
      });
      // Actualizar planSel en memoria para reflejar el cambio inmediatamente
      setPlanSel(prev=>prev&&prev.id===plan.id?{...prev,aprobado:false,aprobadoPor:null,aprobadoAt:null}:prev);
    }catch(err){alert('Error al desbloquear: '+err.message);}
  };
  const guardarPlan=async(e)=>{
    e.preventDefault();setLoading(true);
    try{
      const ref=db.collection('coonecta_datos').doc(entidad.id).collection('planes_operativos');
      const data={...formPlan,updatedAt:firebase.firestore.FieldValue.serverTimestamp()};
      if(itemEdit){
        await ref.doc(itemEdit.id).update(data);
      }else{
        await ref.add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      }
      setModalPlan(false);setFormPlan({});setItemEdit(null);
    }catch(err){alert('Error: '+err.message);}
    finally{setLoading(false);}
  };
  
  const eliminarPlan=async(id)=>{
    if(!window.confirm('¿Eliminar plan y todas sus actividades?'))return;
    const batch=db.batch();
    batch.delete(db.collection('coonecta_datos').doc(entidad.id).collection('planes_operativos').doc(id));
    const acts=await db.collection('coonecta_datos').doc(entidad.id).collection('poa_actividades').where('planId','==',id).get();
    acts.forEach(doc=>batch.delete(doc.ref));
    await batch.commit();
  };
  
  const guardarActividad=async(e)=>{
    e.preventDefault();setLoading(true);
    try{
      const ref=db.collection('coonecta_datos').doc(entidad.id).collection('poa_actividades');
      const data={
        ...formActividad,
        planId:planSel.id,
        estado:formActividad.estado||'Programada',
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      };
      if(itemEdit){
        await ref.doc(itemEdit.id).update(data);
      }else{
        await ref.add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
      }
      setModalActividad(false);setFormActividad({});setItemEdit(null);
    }catch(err){alert('Error: '+err.message);}
    finally{setLoading(false);}
  };
  
  const eliminarActividad=async(id)=>{
    if(!window.confirm('¿Eliminar?'))return;
    await db.collection('coonecta_datos').doc(entidad.id).collection('poa_actividades').doc(id).delete();
  };
  
  const guardarSeguimiento=async(e)=>{
    e.preventDefault();setLoading(true);
    try{
      const updateData={
        estado:modalSeguimiento.estado,
        observacionesSeguimiento:modalSeguimiento.observacionesSeguimiento,
        fechaCambioEstado:new Date().toISOString().split('T')[0]
      };
      if(modalSeguimiento.estado==='Reprogramado'){
        if(!modalSeguimiento.fechaReprogramada){alert('Debes ingresar la nueva fecha reprogramada.');setLoading(false);return;}
        updateData.fechaReprogramada=modalSeguimiento.fechaReprogramada;
        updateData.historialReprogramaciones=firebase.firestore.FieldValue.arrayUnion({
          fecha:new Date().toISOString().split('T')[0],
          nuevaFecha:modalSeguimiento.fechaReprogramada,
          motivo:modalSeguimiento.observacionesSeguimiento||''
        });
      }
      if(modalSeguimiento.estado==='Cancelada'){
        if(!modalSeguimiento.observacionesSeguimiento){alert('Debes ingresar el motivo de cancelación.');setLoading(false);return;}
      }
      await db.collection('coonecta_datos').doc(entidad.id).collection('poa_actividades').doc(modalSeguimiento.id).update(updateData);
      setModalSeguimiento(null);
    }catch(err){alert('Error: '+err.message);}
    finally{setLoading(false);}
  };
  
  const estadoColor={
    'Programada':{bg:'#FEF3C7',c:'#92400E'},
    'En Proceso':{bg:'#FFE0E0',c:'#1E40AF'},
    'Completado':{bg:'#D1FAE5',c:'#065F46'},
    'Reprogramado':{bg:'#FEE2E2',c:'#991B1B'},
    'Cancelada':{bg:'#F3F4F6',c:'#374151'}
  };

  const guardarSeguimientoMensual=async(act,mesKey,observacion)=>{
    if(!observacion.trim())return;
    try{
      const update={};
      update[`seguimientoMensual.${mesKey}.observacion`]=observacion;
      update[`seguimientoMensual.${mesKey}.fecha`]=new Date().toISOString().split('T')[0];
      if(act.estado==='Programada'){update.estado='En Proceso';update.fechaCambioEstado=new Date().toISOString().split('T')[0];}
      await db.collection('coonecta_datos').doc(entidad.id).collection('poa_actividades').doc(act.id).update(update);
    }catch(err){alert('Error: '+err.message);}
  };

  // Funciones de cálculo disponibles globalmente (getMesesRango, calcAvanceActividad, calcAvancePOA)
  
  return(<div>
    <div className="page-header">
      <h1>🗓️ Plan Operativo Anual</h1>
      {!planSel?
        (!isMonitoreo&&<button className="btn-primary" style={{width:'auto'}} onClick={()=>{setFormPlan({anio:new Date().getFullYear().toString()});setItemEdit(null);setModalPlan(true);}} disabled={!isAdmin}>+ Nuevo POA</button>)
      :
        <div style={{display:'flex',gap:'0.5rem'}}>
          <button className={`btn-${vista==='actividades'?'primary':'secondary'}`} onClick={()=>setVista('actividades')} style={{width:'auto'}}>📋 Actividades</button>
          <button className={`btn-${vista==='seguimiento'?'primary':'secondary'}`} onClick={()=>setVista('seguimiento')} style={{width:'auto'}}>✅ Seguimiento</button>
          <button className="btn-primary" onClick={()=>setModalScore(true)} style={{width:'auto',background:'#059669'}}>📊 Avance</button>
          <button className="btn-secondary" onClick={()=>{setPlanSel(null);setVista('planes');}} style={{width:'auto'}}>← Volver</button>
        </div>
      }
    </div>
    
    {!planSel?
    <div>
      <div className="card">
        <div style={{marginBottom:'1rem'}}>
          <input 
            type="text" 
            placeholder="🔍 Buscar plan por nombre..." 
            value={busquedaPOA} 
            onChange={e=>setBusquedaPOA(e.target.value)}
            style={{width:'100%',padding:'0.75rem',border:'1px solid #D1D5DB',borderRadius:'8px',fontSize:'0.95rem'}}
          />
        </div>
        <h3>Planes Operativos ({planesFiltrados.length})</h3>
        {planesFiltrados.length===0?<p style={{color:'#9CA3AF'}}>No hay planes. Crea el primero.</p>:
        <div style={{display:'grid',gap:'1rem'}}>
          {planesFiltrados.map(plan=>{
            const actsPlan=todasActividades.filter(a=>a.planId===plan.id);
            const avance=calcAvancePOA(actsPlan);
            const objs=objetivos.filter(o=>(plan.objetivosIds||[]).includes(o.id));
            return(<div key={plan.id} className="card" style={{padding:'1rem',background:'#F9FAFB',cursor:'pointer'}} onClick={()=>{setPlanSel(plan);setVista('actividades');}}>
              <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start'}}>
                <div style={{flex:1}}>
                  <h4 style={{margin:'0 0 0.5rem 0',color:'#111827'}}>{plan.nombre}</h4>
                  <p style={{margin:'0.25rem 0',fontSize:'0.85rem',color:'#6B7280'}}>📅 Año: {plan.anio}</p>
                  <p style={{margin:'0.25rem 0',fontSize:'0.85rem',color:'#6B7280'}}>🎯 Objetivos: {objs.length}</p>
                  {plan.lider&&<p style={{margin:'0.25rem 0',fontSize:'0.85rem',color:'#A5C139'}}>👤 Líder: {plan.lider}</p>}
                  <div style={{marginTop:'0.5rem'}}>
                    <div style={{display:'flex',justifyContent:'space-between',marginBottom:'0.25rem'}}>
                      <span style={{fontSize:'0.8rem',color:'#6B7280'}}>Avance:</span>
                      <span style={{fontSize:'0.85rem',fontWeight:700,color:avance>=100?'#059669':avance>=50?'#F59E0B':'#DC2626'}}>{avance}%</span>
                    </div>
                    <div style={{width:'100%',height:'6px',background:'#E5E7EB',borderRadius:'3px'}}>
                      <div style={{width:avance+'%',height:'100%',background:avance>=100?'#059669':avance>=50?'#F59E0B':'#DC2626'}}></div>
                    </div>
                  </div>
                  {objs.length>0&&<div style={{marginTop:'0.5rem',display:'flex',flexWrap:'wrap',gap:'0.25rem'}}>
                    {objs.map(obj=><span key={obj.id} style={{fontSize:'0.75rem',padding:'0.25rem 0.5rem',background:'#FFF0F0',color:'#A5C139',borderRadius:'4px'}}>{obj.nombre}</span>)}
                  </div>}
                  {plan.descripcion&&<p style={{margin:'0.5rem 0 0 0',fontSize:'0.85rem',color:'#6B7280',fontStyle:'italic'}}>"{plan.descripcion}"</p>}
                </div>
                <div style={{display:'flex',gap:'0.3rem'}} onClick={e=>e.stopPropagation()}>
                  {plan.aprobado&&<span style={{background:'#059669',color:'white',fontSize:'0.7rem',padding:'2px 8px',borderRadius:'12px'}}>✅ Aprobado</span>}
                  {!isMonitoreo&&!plan.aprobado&&<button className="btn-edit" onClick={()=>{setFormPlan(plan);setItemEdit(plan);setModalPlan(true);}} style={{padding:'0.3rem 0.5rem',fontSize:'0.75rem'}}>✏️</button>}

                  const acts=actividades.filter(a=>a.estado===estado);
                  if(acts.length===0)return null;
                  const cols={'Completado':{bg:'#D1FAE5',c:'#065F46'},'En Proceso':{bg:'#FFE0E0',c:'#1E40AF'},'Programada':{bg:'#FEF3C7',c:'#92400E'},'Reprogramado':{bg:'#FEE2E2',c:'#991B1B'},'Cancelada':{bg:'#F3F4F6',c:'#374151'}};
                  const col=cols[estado];
                  return(<div key={estado} style={{marginBottom:'1.5rem'}}>
                    <h4 style={{padding:'0.5rem 1rem',background:col.bg,color:col.c,borderRadius:'6px',display:'inline-block'}}>{estado} ({acts.length})</h4>
                    <table className="tabla" style={{fontSize:'0.85rem',marginTop:'0.5rem'}}>
                      <thead><tr><th>Actividad</th><th>Responsable</th><th>Fechas</th><th>Avance</th><th>Seguimiento mensual</th></tr></thead>
                      <tbody>{acts.map(act=>{
                        const avAct=calcAvanceActividad(act);
                        const mesesAct=getMesesRango(act.fechaInicio,act.fechaFin);
                        const segMens=act.seguimientoMensual||{};
                        const mesesConReg=mesesAct.filter(m=>segMens[m.key]?.observacion);
                        const mesesReg=mesesConReg.length;
                        return(<React.Fragment key={act.id}>
                          <tr>
                            <td><strong>{act.actividad}</strong>{act.tarea&&<div style={{fontSize:'0.8rem',color:'#6B7280'}}>{act.tarea}</div>}</td>
                            <td>{act.responsable}</td>
                            <td style={{fontSize:'0.8rem'}}>{act.fechaInicio} → {act.fechaFin||'-'}{act.fechaReprogramada&&<div style={{color:'#DC2626',fontSize:'0.75rem'}}>🔁 Nueva: {act.fechaReprogramada}</div>}</td>
                            <td><span style={{fontWeight:700,color:avAct>=100?'#059669':avAct>=50?'#F59E0B':'#DC2626'}}>{avAct}%</span></td>
                            <td style={{fontSize:'0.8rem',color:'#6B7280'}}>{mesesAct.length>0?`${mesesReg}/${mesesAct.length} meses`:'-'}</td>
                          </tr>
                          {mesesConReg.length>0&&mesesConReg.map(m=>(
                            <tr key={m.key} style={{background:'#F9FAFB'}}>
                              <td colSpan={2} style={{fontSize:'0.78rem',color:'#A5C139',paddingLeft:'1.5rem',fontWeight:600}}>↳ {m.label}</td>
                              <td colSpan={3} style={{fontSize:'0.78rem',color:'#374151'}}>{segMens[m.key].observacion}</td>
                            </tr>
                          ))}
                        </React.Fragment>);
                      })}</tbody>
                    </table>
                  </div>);
                })}
              </div>
            </div>);
          })()}
        </div>
      </div>
    </div>}

  </div>);
};

const HistorialSeguimiento=({seguimientos,indicador,scoreIcon,onEditar,onEliminar})=>{
  const[anioHist,setAnioHist]=useState('');
  const aniosHist=[...new Set(seguimientos.map(s=>String(s.anio)))].sort((a,b)=>b-a);
  const segsFilt=anioHist?seguimientos.filter(s=>String(s.anio)===anioHist):seguimientos;
  return(<div className="card">
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem'}}>
      <h3 style={{margin:0}}>Historial de Registros</h3>
      {aniosHist.length>1&&<div style={{display:'flex',alignItems:'center',gap:'0.5rem'}}>
        <label style={{fontSize:'0.85rem',fontWeight:600,color:'#6B7280'}}>Año:</label>
        <select value={anioHist} onChange={e=>setAnioHist(e.target.value)}
          style={{padding:'0.3rem 0.5rem',border:'1px solid #E5E7EB',borderRadius:'6px',fontSize:'0.85rem'}}>
          <option value="">Todos</option>
          {aniosHist.map(a=><option key={a} value={a}>{a}</option>)}
        </select>
        {anioHist&&<button onClick={()=>setAnioHist('')} style={{padding:'0.3rem 0.5rem',border:'1px solid #E5E7EB',borderRadius:'6px',background:'white',cursor:'pointer',fontSize:'0.8rem'}}>✕</button>}
      </div>}
    </div>
    {segsFilt.length===0
      ?<div className="empty-state" style={{padding:'1.5rem'}}><p>No hay registros{anioHist?' para '+anioHist:''}.</p></div>
      :<div style={{overflowX:'auto'}}>
        {indicador?.tipoMeta==='acumulativa'&&(()=>{
          const total=segsFilt.reduce((acc,s)=>acc+parseFloat(s.avance||0),0);
          return(<div style={{background:'#FFF0F0',padding:'1rem',borderRadius:'8px',marginBottom:'1rem',border:'2px solid #FFBCBC'}}>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span style={{fontSize:'0.9rem',color:'#6B7280',fontWeight:600}}>TOTAL ACUMULADO{anioHist?' '+anioHist:''}</span>
              <div style={{fontSize:'1.8rem',fontWeight:'bold',color:'#A5C139'}}>📈 {total.toFixed(2)} {indicador.unidad}</div>
            </div>
          </div>);
        })()}
        <table className="tabla">
          <thead><tr><th>Período</th><th>Meta Anual</th><th>Meta Mes</th><th>Avance</th><th>Rendimiento</th><th>Score</th><th>Obs.</th><th>Acciones</th></tr></thead>
          <tbody>{segsFilt.map(seg=>(
            <tr key={seg.id}>
              <td><strong>{seg.mes} {seg.anio}</strong></td>
              <td>{(indicador.metasPorAnio&&seg.anio&&indicador.metasPorAnio[String(seg.anio)]!==undefined?indicador.metasPorAnio[String(seg.anio)]:indicador.meta)||seg.metaAnual} {indicador.unidad}</td>
              <td>{seg.metaMes} {indicador.unidad}</td>
              <td>{seg.avance} {indicador.unidad}</td>
              <td><strong>{seg.rendimiento?.toFixed(2)}%</strong></td>
              <td><div className={'semaforo '+(seg.score||'sin_meta')}>{scoreIcon[seg.score||'sin_meta']}</div></td>
              <td style={{maxWidth:'120px',fontSize:'0.8rem',color:'#6B7280'}}>{seg.observaciones}</td>
              <td><div style={{display:'flex',gap:'0.3rem'}}>
                <button className="btn-edit" onClick={()=>onEditar(seg)}>✏️</button>
                <button className="btn-secondary" style={{padding:'0.3rem 0.5rem',fontSize:'0.8rem'}} onClick={()=>onEliminar(seg.id)}>🗑️</button>
              </div></td>
            </tr>
          ))}</tbody>
        </table>
      </div>}
  </div>);
};

const VistaSeguimiento=({user,entidad,datos,isMonitoreo,userCargo})=>{
  const[indicadorSel,setIndicadorSel]=useState(null);
  const[busquedaSeg,setBusquedaSeg]=useState('');
  const[ejeSel,setEjeSel]=useState('');
  const[objetivoSel,setObjetivoSel]=useState('');
  const[segEdit,setSegEdit]=useState(null);
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({});
  const[loading,setLoading]=useState(false);
  const[busquedaPOA,setBusquedaPOA]=useState('');
  const[seguimientos,setSeguimientos]=useState([]);

  useEffect(()=>{
    if(!entidad||!indicadorSel)return;
    const ref=db.collection('coonecta_datos').doc(entidad.id).collection('seguimientos');
    const unsub=ref.where('indicadorId','==',indicadorSel).onSnapshot(s=>{
      const d=[];s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      d.sort((a,b)=>{const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre','Semestral 1','Semestral 2','Anual'];return(a.anio-b.anio)||meses.indexOf(a.mes)-meses.indexOf(b.mes);});
      setSeguimientos(d);
    });
    return()=>unsub();
  },[entidad,indicadorSel]);

  if(!entidad||!datos)return <div className="empty-state"><h3>Selecciona entidad</h3></div>;
  const{ejes=[],objetivos=[],indicadores=[]}=datos;
  const indicador=indicadores.find(i=>i.id===indicadorSel);

  const scoreConfig=entidad?.scoreConfig||{critico:{min:0,max:60},precaucion:{min:61,max:85},optimo:{min:86,max:100}};
  const calcScore=(avance,metaMes,tipo)=>{
    if(!metaMes||metaMes===0)return'sin_meta';
    const r=(avance/metaMes)*100;
    if(tipo==='descendente'){
      // Descendente: cumple si avance <= meta (r<=100 es óptimo)
      const inv=r===0?100:Math.min((metaMes/avance)*100,200);
      if(inv>=scoreConfig.optimo.min)return'optimo';
      if(inv>=scoreConfig.precaucion.min)return'precaucion';
      return'critico';
    }
    // Ascendente: usar rangos de scoreConfig de la entidad
    if(r>=scoreConfig.optimo.min)return'optimo';
    if(r>=scoreConfig.precaucion.min)return'precaucion';
    return'critico';
  };

  const guardar=async(e)=>{
    e.preventDefault();setLoading(true);
    try{
      const metaMes=parseFloat(form.metaMes||0);
      const avance=parseFloat(form.avance||0);
      const metaAnioSel=indicador?.metasPorAnio&&form.anio&&indicador.metasPorAnio[String(form.anio)]!==undefined
        ?indicador.metasPorAnio[String(form.anio)]
        :indicador?.meta||0;
      const metaAnual=parseFloat(form.metaAnual||metaAnioSel||0);
      // Rendimiento: ascendente = avance/meta*100, descendente = meta/avance*100 (menor es mejor)
      const rendimiento=metaMes>0
        ?(indicador?.tipo==='descendente'
          ?(avance===0?100:Math.min((metaMes/avance)*100,200))
          :(avance/metaMes)*100)
        :0;
      const score=calcScore(avance,metaMes,indicador?.tipo);
      const data={...form,metaMes,avance,metaAnual,rendimiento,score,indicadorId:indicadorSel};
      const ref=db.collection('coonecta_datos').doc(entidad.id).collection('seguimientos');
      if(segEdit){await ref.doc(segEdit.id).update(data);}
      else{await ref.add({...data,createdAt:firebase.firestore.FieldValue.serverTimestamp()});}
      setModal(false);setForm({});setSegEdit(null);
    }catch(err){alert('Error: '+err.message);}
    finally{setLoading(false);}
  };

  const editarSeg=(s)=>{setSegEdit(s);setForm({...s});setModal(true);};

  const eliminarSeg=async(id)=>{
    if(!window.confirm('¿Eliminar este registro de seguimiento?'))return;
    await db.collection('coonecta_datos').doc(entidad.id).collection('seguimientos').doc(id).delete();
  };

  const scoreColor={optimo:'#D1FAE5',precaucion:'#FEF3C7',critico:'#FEE2E2',sin_meta:'#F3F4F6'};
  const scoreIcon={optimo:'🟢',precaucion:'🟡',critico:'🔴',sin_meta:'⚪'};
  const meses=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre','Semestral 1','Semestral 2','Anual'];

  const objetivosPorEje=ejeSel?objetivos.filter(o=>o.ejeId===ejeSel):objetivos;
  const indicadoresFiltrados=indicadores.filter(i=>{
    if(!isMonitoreo&&userCargo&&i.cargoResponsable&&i.cargoResponsable.trim().toLowerCase()!==userCargo.trim().toLowerCase())return false;
    const o=objetivos.find(x=>x.id===i.objetivoId);
    const ej=ejes.find(x=>x.id===o?.ejeId);
    if(ejeSel&&ej?.id!==ejeSel)return false;
    if(objetivoSel&&o?.id!==objetivoSel)return false;
    return(i.nombre+' '+(o?.nombre||'')+' '+(ej?.nombre||'')).toLowerCase().includes(busquedaSeg.toLowerCase());
  });

  return(<div>
    <div className="page-header" style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <h1>📋 Seguimiento de Indicadores</h1>
      <div style={{display:"flex",gap:"0.5rem"}}>
        <button className="btn-primary print-btn" onClick={()=>window.print()} style={{width:"auto"}}>🖨️ Imprimir</button>
        {indicadorSel&&<button className="btn-primary" style={{width:'auto'}}
        onClick={()=>{if(isMonitoreo)return;setSegEdit(null);setForm({mes:meses[new Date().getMonth()],anio:new Date().getFullYear().toString(),avance:'',metaMes:'',metaAnual:indicador?.meta||'',observaciones:''});setModal(true);}}>
        {!isMonitoreo&&'+ Nuevo Registro'}{isMonitoreo&&'👁️ Solo lectura'}
      </button>}
      </div>
    </div>
    <div className="card">
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem',marginBottom:'1rem'}}>
        <div className="form-group" style={{margin:0}}>
          <label style={{fontSize:'0.85rem',fontWeight:600}}>Filtrar por Eje</label>
          <select value={ejeSel} onChange={e=>{setEjeSel(e.target.value);setObjetivoSel('');setIndicadorSel(null);}}
            style={{width:'100%',padding:'0.5rem',border:'2px solid #E5E7EB',borderRadius:'8px',fontSize:'0.9rem'}}>
            <option value="">Todos los ejes</option>
            {ejes.map(e=><option key={e.id} value={e.id}>{e.nombre}</option>)}
          </select>
        </div>
        <div className="form-group" style={{margin:0}}>
          <label style={{fontSize:'0.85rem',fontWeight:600}}>Filtrar por Objetivo</label>
          <select value={objetivoSel} onChange={e=>{setObjetivoSel(e.target.value);setIndicadorSel(null);}}
            style={{width:'100%',padding:'0.5rem',border:'2px solid #E5E7EB',borderRadius:'8px',fontSize:'0.9rem'}}>
            <option value="">Todos los objetivos</option>
            {objetivosPorEje.map(o=>{
              const eje=ejes.find(e=>e.id===o.ejeId);
              return<option key={o.id} value={o.id}>{ejeSel?o.nombre:`[${eje?.nombre}] ${o.nombre}`}</option>;
            })}
          </select>
        </div>
      </div>
      <div className="form-group" style={{margin:0}}>
        <label style={{fontSize:'0.85rem',fontWeight:600}}>Buscar y seleccionar Indicador
          <span style={{marginLeft:'0.5rem',fontWeight:400,color:'#6B7280'}}>({indicadoresFiltrados.length} indicadores)</span>
          {(ejeSel||objetivoSel||busquedaSeg)&&<button onClick={()=>{setEjeSel('');setObjetivoSel('');setBusquedaSeg('');setIndicadorSel(null);}} style={{marginLeft:'0.75rem',padding:'0.15rem 0.5rem',border:'1px solid #E5E7EB',borderRadius:'4px',background:'white',cursor:'pointer',fontSize:'0.75rem',color:'#6B7280'}}>✕ Limpiar filtros</button>}
        </label>
        <input type="text" value={busquedaSeg} onChange={e=>setBusquedaSeg(e.target.value)} placeholder="Escribe para filtrar por nombre..." style={{marginBottom:'0.5rem'}}/>
        <select value={indicadorSel||''} onChange={e=>setIndicadorSel(e.target.value||null)}
          size={Math.min(8,indicadoresFiltrados.length+1)} style={{height:'auto',minHeight:'80px'}}>
          <option value="">-- Seleccionar indicador --</option>
          {indicadoresFiltrados.map(ind=>{
            const obj=objetivos.find(o=>o.id===ind.objetivoId);
            const eje=ejes.find(e=>e.id===obj?.ejeId);
            return<option key={ind.id} value={ind.id}>[{eje?.nombre}] {obj?.nombre?obj.nombre.substring(0,30)+'…':''} — {ind.nombre}</option>;
          })}
        </select>
      </div>
    </div>
    {!indicadorSel&&<div className="empty-state"><h3>Selecciona un indicador para ver su seguimiento</h3></div>}
    {indicador&&(<>
      <div className="card">
        <h3>{indicador.nombre}</h3>
        <p style={{color:'#6B7280',margin:'0.25rem 0'}}>{indicador.tipo==='ascendente'?'📈':'📉'} Meta anual: {indicador.meta} {indicador.unidad}</p>
        {indicador.metasPorAnio&&<div style={{fontSize:'0.8rem',color:'#A5C139',marginTop:'0.5rem'}}>
          📅 Metas por año: {Object.entries(indicador.metasPorAnio).map(([a,m])=>a+': '+m).join(' | ')}
        </div>}
      </div>
      <HistorialSeguimiento
        seguimientos={seguimientos}
        indicador={indicador}
        scoreIcon={scoreIcon}
        onEditar={editarSeg}
        onEliminar={eliminarSeg}
      />
    </>)}
    {modal&&indicador&&(<div className="modal-overlay" onClick={()=>{setModal(false);setSegEdit(null);}}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-header">
          <h2>{segEdit?'✏️ Editar Registro':'Registrar Seguimiento'}</h2>
          <button className="btn-cerrar" onClick={()=>{setModal(false);setSegEdit(null);}}>×</button>
        </div>
        <div className="modal-body">
          <div style={{background:'#FFF0F0',padding:'0.5rem 0.75rem',borderRadius:'6px',marginBottom:'0.75rem',fontSize:'0.875rem',color:'#A5C139'}}>
            {indicador.nombre}
          </div>
          <form onSubmit={guardar}>
            <div className="form-row">
              <div className="form-group">
                <label>Mes *</label>
                <select value={form.mes||''} onChange={e=>{
                    const mes=e.target.value;
                    const metaAuto=indicador?.metasMensuales&&form.anio&&indicador.metasMensuales[String(form.anio)]&&indicador.metasMensuales[String(form.anio)][mes]!==undefined
                      ?indicador.metasMensuales[String(form.anio)][mes]:'';
                    setForm({...form,mes,metaMes:metaAuto!==''?String(metaAuto):form.metaMes});
                  }} required>
                  <option value="">Seleccionar periodo...</option>
                  {meses.map(m=><option key={m} value={m}>{m}</option>)}
                </select>
              </div>
              <div className="form-group">
                <label>Año *</label>
                <select value={form.anio||new Date().getFullYear()} onChange={e=>setForm({...form,anio:e.target.value})} required>
                  {['2024','2025','2026','2027','2028'].map(a=><option key={a} value={a}>{a}</option>)}
                </select>
              </div>
            </div>
            <div className="form-row">
              <div className="form-group">
                <label>Meta Anual ({indicador.unidad})</label>
                <input type="number" value={form.metaAnual||(indicador.metasPorAnio&&form.anio&&indicador.metasPorAnio[String(form.anio)]!==undefined?indicador.metasPorAnio[String(form.anio)]:indicador.meta)||''} onChange={e=>setForm({...form,metaAnual:e.target.value})}/>
              </div>
              <div className="form-group">
                <label>Meta del Mes ({indicador.unidad}){isMonitoreo&&' (definida por admin)'}</label>
                <input type="number"
                  value={form.metaMes||(indicador.metasMensuales&&form.anio&&form.mes&&indicador.metasMensuales[String(form.anio)]&&indicador.metasMensuales[String(form.anio)][form.mes]!==undefined?indicador.metasMensuales[String(form.anio)][form.mes]:'')||''}
                  onChange={e=>!isMonitoreo&&setForm({...form,metaMes:e.target.value})}
                  readOnly={isMonitoreo}
                  style={{background:isMonitoreo?'#F3F4F6':undefined}}
                  required/>
              </div>
            </div>
            <div className="form-group">
              <label>Avance Real ({indicador.unidad}) *</label>
              <input type="number" value={form.avance||''} onChange={e=>setForm({...form,avance:e.target.value})} required/>
            </div>
            <div className="form-group">
              <label>Observaciones</label>
              <textarea value={form.observaciones||''} onChange={e=>setForm({...form,observaciones:e.target.value})} rows={3}/>
            </div>
            <button type="submit" className="btn-primary" disabled={loading}>
              {loading?'⏳...':(segEdit?'💾 Actualizar':'💾 Guardar Actividad')}
            </button>
          </form>
        </div>
      </div>
    </div>)}
  </div>);
};const VistaUsuarios=({user,userRol,entidad})=>{
  const[usuarios,setUsuarios]=useState([]);
  const[modal,setModal]=useState(false);
  const[form,setForm]=useState({email:'',password:'',rol:'seguimiento',nombre:''});
  const[usuarioEdit,setUsuarioEdit]=useState(null);
  const[loading,setLoading]=useState(false);
  const[busquedaPOA,setBusquedaPOA]=useState('');
  const[mensaje,setMensaje]=useState({texto:'',tipo:''});

  useEffect(()=>{
    if(!entidad)return;
    const unsub=db.collection('coonecta_usuarios').onSnapshot(s=>{
      const d=[];
      s.forEach(doc=>d.push({id:doc.id,...doc.data()}));
      d.sort((a,b)=>(a.nombre||a.email).localeCompare(b.nombre||b.email));
      setUsuarios(d);
    });
    return()=>unsub();
  },[entidad]);

  const crearUsuario=async(e)=>{
    e.preventDefault();setLoading(true);setMensaje({texto:'',tipo:''});
    try{
      if(usuarioEdit){
        await db.collection('coonecta_usuarios').doc(usuarioEdit.id).update({nombre:form.nombre||form.email,rol:form.rol,cargo:form.cargo||''});
        setMensaje({texto:'Actualizado.',tipo:'ok'});
        setModal(false);setForm({email:'',password:'',rol:'seguimiento',nombre:''});setUsuarioEdit(null);
        setLoading(false);return;
      }
      // Verificar si ya existe en esta colección
      const existing=await db.collection('coonecta_usuarios').where('email','==',form.email).get();
      if(!existing.empty){
        // Ya existe en esta entidad — solo actualizar datos
        await existing.docs[0].ref.update({nombre:form.nombre||form.email,rol:form.rol,cargo:form.cargo||''});
        setMensaje({texto:'Usuario actualizado.',tipo:'ok'});
      }else{
        // Intentar crear en Firebase Auth
        let uid=null;
        try{
          const _app=firebase.initializeApp(firebase.app().options,'sec'+Date.now());
          const _auth=_app.auth();
          const cred=await _auth.createUserWithEmailAndPassword(form.email,form.password);
          uid=cred.user.uid;
          await _auth.signOut();await _app.delete();
        }catch(authErr){
          // Si ya existe en Auth (email-already-in-use), buscar su UID en otras colecciones
          if(authErr.code==='auth/email-already-in-use'){
            // Buscar el UID en otras colecciones de usuarios
            const colecciones=['coosanroque_usuarios','coonecta_usuarios','coonecta_usuarios','coogomezplata_usuarios','unioncoop_usuarios','coonecta_usuarios'];
            for(const col of colecciones){
              const snap=await db.collection(col).where('email','==',form.email).get();
              if(!snap.empty){uid=snap.docs[0].id;break;}
            }
            if(!uid){setMensaje({texto:'El correo ya existe en Firebase pero no se encontró su ID. Agrégalo manualmente.',tipo:'error'});setLoading(false);return;}
          }else{
            throw authErr;
          }
        }
        // Registrar en esta entidad con sus propios datos
        await db.collection('coonecta_usuarios').doc(uid).set({
          email:form.email,nombre:form.nombre||form.email,rol:form.rol,cargo:form.cargo||'',
          entidadId:'general',creadoPor:user.uid,
          createdAt:firebase.firestore.FieldValue.serverTimestamp()
        });
        setMensaje({texto:'Usuario agregado a esta entidad.',tipo:'ok'});
      }
      setForm({email:'',password:'',rol:'seguimiento',nombre:''});
    }catch(err){setMensaje({texto:'Error: '+err.message,tipo:'error'});}
    finally{setLoading(false);}
  };

  const abrirEditar=(u)=>{
    setUsuarioEdit(u);
    setForm({email:u.email,nombre:u.nombre||'',rol:u.rol,password:'',cargo:u.cargo||''});
    setModal(true);
  };

  const cambiarRol=async(uid,nuevoRol)=>{
    await db.collection('coonecta_usuarios').doc(uid).update({rol:nuevoRol});
  };

  const resetPassword=async(email)=>{
    try{
      await auth.sendPasswordResetEmail(email);
      setMensaje({texto:'Email de recuperacion enviado a '+email,tipo:'ok'});
      setTimeout(()=>setMensaje({texto:'',tipo:''}),5000);
    }catch(err){setMensaje({texto:'Error: '+err.message,tipo:'error'});}
  };

  const eliminarUsuario=async(uid,email)=>{
    if(!window.confirm('Eliminar usuario '+email+'?'))return;
    await db.collection('coonecta_usuarios').doc(uid).delete();
  };

  const badges={admin:{bg:'#FFF0F0',color:'#A5C139',label:'🔑 Admin'},seguimiento:{bg:'#F0FDF4',color:'#166534',label:'📝 Seguimiento'},monitoreo:{bg:'#FFE0E0',color:'#1E40AF',label:'👁️ Monitoreo'}};

  return(<div>
    <div className="page-header">
      <h1>Usuarios</h1>
      <button className="btn-primary" style={{width:'auto'}}
        onClick={()=>{setUsuarioEdit(null);setForm({email:'',password:'',rol:'seguimiento',nombre:''});setModal(true);}}>
        + Nuevo Usuario
      </button>
    </div>
    {mensaje.texto&&<div className={mensaje.tipo==='ok'?'success-message':'error-message'}>{mensaje.texto}</div>}
    <div className="card">
      <table className="tabla">
        <thead><tr><th>Nombre / Email</th><th>Rol</th><th>Cambiar Rol</th><th>Acciones</th></tr></thead>
        <tbody>{usuarios.map(u=>{
          const b=badges[u.rol]||badges.seguimiento;
          const esTu=(u.id===user.uid);
          return(
            <tr key={u.id}>
              <td>
                <strong>{u.nombre||u.email}</strong>
                {esTu&&<span style={{marginLeft:'0.5rem',fontSize:'0.75rem',color:'#6B7280'}}>(Tu)</span>}
                <div style={{fontSize:'0.8rem',color:'#6B7280'}}>{u.email}</div>
                {u.cargo&&<span style={{fontSize:'0.75rem',color:'#A5C139'}}>🏷️ {u.cargo}</span>}
              </td>
              <td><span style={{padding:'0.25rem 0.75rem',borderRadius:'12px',fontSize:'0.8rem',fontWeight:700,background:b.bg,color:b.color}}>{b.label}</span></td>
              <td>{!esTu&&(
                <select value={u.rol} onChange={e=>cambiarRol(u.id,e.target.value)}
                  style={{padding:'0.4rem 0.5rem',borderRadius:'6px',border:'2px solid #E5E7EB',fontSize:'0.875rem'}}>
                  <option value="admin">Admin</option>
                  <option value="seguimiento">Seguimiento</option>
                  <option value="monitoreo">Monitoreo</option>
                </select>
              )}</td>
              <td>{!esTu&&(
                <div style={{display:'flex',gap:'0.4rem',flexWrap:'wrap'}}>
                  <button className="btn-edit" onClick={()=>abrirEditar(u)}>Editar</button>
                  <button style={{padding:'0.4rem 0.6rem',fontSize:'0.8rem',background:'#FEF3C7',color:'#92400E',border:'1px solid #F59E0B',borderRadius:'6px',cursor:'pointer'}}
                    onClick={()=>resetPassword(u.email)}>Reset Clave</button>
                  <button className="btn-secondary" style={{padding:'0.4rem 0.6rem',fontSize:'0.8rem'}}
                    onClick={()=>eliminarUsuario(u.id,u.email)}>Eliminar</button>
                </div>
              )}</td>
            </tr>
          );
        })}</tbody>
      </table>
    </div>
    {modal&&<div className="modal-overlay" onClick={()=>{setModal(false);setUsuarioEdit(null);}}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <div className="modal-header">
          <h2>{usuarioEdit?'Editar Usuario':'Nuevo Usuario'}</h2>
          <button className="btn-cerrar" onClick={()=>{setModal(false);setUsuarioEdit(null);setForm({email:'',password:'',rol:'seguimiento',nombre:''});}}>x</button>
        </div>
        <div className="modal-body">
          <form onSubmit={crearUsuario}>
            <div className="form-group">
              <label>Nombre</label>
              <input type="text" value={form.nombre} onChange={e=>setForm({...form,nombre:e.target.value})} placeholder="Nombre completo"/>
            </div>
            <div className="form-group">
              <label>Email</label>
              <input type="email" value={form.email} onChange={e=>setForm({...form,email:e.target.value})}
                required placeholder="usuario@correo.com" readOnly={!!usuarioEdit}
                style={{background:usuarioEdit?'#F3F4F6':''}}/>
            </div>
            {!usuarioEdit&&<div className="form-group">
              <label>Contrasena</label>
              <input type="password" value={form.password} onChange={e=>setForm({...form,password:e.target.value})}
                required placeholder="Minimo 6 caracteres" minLength={6}/>
            </div>}
            <div className="form-group">
              <label>Rol</label>
              <select value={form.rol} onChange={e=>setForm({...form,rol:e.target.value})}>
                <option value="admin">Admin - Control total</option>
                <option value="seguimiento">Seguimiento - Solo registrar avances</option>
                <option value="monitoreo">Monitoreo</option>
              </select>
            </div>
            {(form.rol==='seguimiento'||form.rol==='monitoreo')&&<div className="form-group">
              <label>Cargo</label>
              <CargosSelect value={form.cargo||''} onChange={v=>setForm({...form,cargo:v})} entidad={entidad}/>
            </div>}
            <button type="submit" className="btn-primary" disabled={loading}>
              {loading?'Espere...':(usuarioEdit?'Guardar Cambios':'Crear Usuario')}
            </button>
          </form>
        </div>
      </div>
    </div>}
  </div>);
};const ModalImpresionDashboard=({entidad,datos,onClose})=>{
  const{ejes=[],objetivos=[],indicadores=[],seguimientos=[]}=datos;
  return(<div className="modal-overlay"><div className="modal" style={{maxWidth:'900px',width:'95%',maxHeight:'90vh',overflow:'auto'}}>
    <div className="modal-header"><h2>Informe - {entidad.nombre}</h2>
      <div style={{display:'flex',gap:'0.5rem'}}>
        <button className="btn-primary" style={{width:'auto'}} onClick={()=>window.print()}>Imprimir</button>
        <button className="btn-cerrar" onClick={onClose}>x</button>
      </div>
    </div>
    <div className="modal-body">
      <h3>Resumen General</h3>
      <table className="tabla"><thead><tr><th>Eje</th><th>Objetivos</th><th>Indicadores</th><th>Con Seguimiento</th></tr></thead>
        <tbody>{ejes.map(eje=>{
          const objs=objetivos.filter(o=>o.ejeId===eje.id);
          const inds=indicadores.filter(i=>objs.some(o=>o.id===i.objetivoId));
          const conSeg=inds.filter(i=>seguimientos.some(s=>s.indicadorId===i.id));
          return<tr key={eje.id}><td>{eje.nombre}</td><td>{objs.length}</td><td>{inds.length}</td><td>{conSeg.length}</td></tr>;
        })}</tbody>
      </table>
      <h3 style={{marginTop:'1.5rem'}}>Detalle por Indicador</h3>
      <table className="tabla"><thead><tr><th>Indicador</th><th>Objetivo</th><th>Meta Anual</th><th>Ultimo Avance</th><th>Score</th></tr></thead>
        <tbody>{indicadores.map(ind=>{
          const obj=objetivos.find(o=>o.id===ind.objetivoId);
          const segs=seguimientos.filter(s=>s.indicadorId===ind.id);
          const ultimo=segs.length>0?segs[segs.length-1]:null;
          return<tr key={ind.id}>
            <td>{ind.nombre}</td><td>{obj?.nombre}</td>
            <td>{getMetaAnio(ind,filtroAnio||new Date().getFullYear())} {ind.unidad}</td>
            <td>{ultimo?ultimo.avance+' '+ind.unidad:'-'}</td>
            <td>{ultimo?<div className={'semaforo '+(ultimo.score||'')} style={{display:'inline-block'}}>{ultimo.score==='critico'&&'Critico'}{ultimo.score==='precaucion'&&'Precaucion'}{ultimo.score==='optimo'&&'Optimo'}</div>:'-'}</td>
          </tr>;
        })}</tbody>
      </table>
    </div>
  </div></div>);
};const ModalImpresionPlaneacion=({entidad,datos,onClose})=>{
  const{ejes=[],objetivos=[],estrategias=[],indicadores=[]}=datos;
  return(<div className="modal-overlay"><div className="modal" style={{maxWidth:'900px',width:'95%',maxHeight:'90vh',overflow:'auto'}}>
    <div className="modal-header"><h2>Planeación - {entidad.nombre}</h2>
      <div style={{display:'flex',gap:'0.5rem'}}>
        <button className="btn-primary" style={{width:'auto'}} onClick={()=>window.print()}>Imprimir</button>
        <button className="btn-cerrar" onClick={onClose}>x</button>
      </div>
    </div>
    <div className="modal-body">
      {ejes.map(eje=>{
        const objsEje=objetivos.filter(o=>o.ejeId===eje.id);
        return(<div key={eje.id} style={{marginBottom:'1.5rem',borderLeft:'4px solid #A5C139',paddingLeft:'1rem'}}>
          <h3 style={{color:'#A5C139',margin:'0 0 0.5rem'}}>{eje.nombre}</h3>
          {objsEje.map(obj=>{
            const indsObj=indicadores.filter(i=>i.objetivoId===obj.id);
            const estsObj=estrategias.filter(es=>es.objetivoId===obj.id);
            const gruposEstrategia=[...estsObj,{id:'',nombre:'Sin estrategia asignada'}];
            return(<div key={obj.id} style={{marginLeft:'1rem',marginBottom:'1rem'}}>
              <h4 style={{margin:'0 0 0.5rem'}}>🎯 {obj.nombre}</h4>
              {gruposEstrategia.map(est=>{
                const indsEst=indsObj.filter(ind=>(ind.estrategiaId||'')===est.id);
                if(indsEst.length===0)return null;
                return(<div key={est.id||'sin'} style={{marginLeft:'1rem',marginBottom:'0.75rem'}}>
                  <p style={{margin:'0 0 0.25rem',fontWeight:600,color:est.id?'#A5C139':'#9CA3AF',fontSize:'0.9rem'}}>↳ {est.nombre}</p>
                  {indsEst.map(ind=>(
                    <div key={ind.id} style={{marginLeft:'1rem',fontSize:'0.875rem',color:'#374151',padding:'0.3rem 0',borderBottom:'1px solid #F3F4F6'}}>
                      <strong>{ind.nombre}</strong> — Meta: {ind.meta} {ind.unidad} | {ind.tipo==='ascendente'?'📈 Ascendente':'📉 Descendente'} | {ind.periodicidad}
                      {ind.metasPorAnio&&Object.keys(ind.metasPorAnio).length>0&&(<div style={{color:'#A5C139',fontSize:'0.8rem'}}>Metas por año: {Object.entries(ind.metasPorAnio).map(([a,m])=>`${a}: ${m}`).join(' · ')}</div>)}
                      {ind.cargoResponsable&&<div style={{color:'#6B7280',fontSize:'0.8rem'}}>Responsable: {ind.cargoResponsable}</div>}
                      {ind.estrategia&&<div style={{color:'#6B7280',fontSize:'0.8rem'}}>Notas: {ind.estrategia}</div>}
                    </div>
                  ))}
                </div>);
              })}
            </div>);
          })}
        </div>);
      })}
    </div>
  </div></div>);
};
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
